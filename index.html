    <script>
    // =========================================================================
    // 1. CẤU HÌNH PWA CHUẨN IPHONE/ANDROID & HẰNG SỐ HỆ THỐNG
    // =========================================================================
    let deferredInstallPrompt = null;
    const IDB_NAME = 'NutriGymVN_AutoDB';
    const IDB_STORE = 'state_store';
    const IDB_KEY = 'main_state_v4';

    const DAY_LABELS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
    const TAB_TITLES = {
        nutrition: 'Dinh dưỡng',
        gym: 'Tập Gym',
        muscles: 'Phục hồi cơ bắp',
        progress: 'Tiến độ cơ thể',
        profile: 'Hồ sơ & Cài đặt'
    };
    const MEAL_META = [
        { key: 'breakfast', label: 'Bữa sáng', icon: '🌅' },
        { key: 'lunch', label: 'Bữa trưa', icon: '☀️' },
        { key: 'dinner', label: 'Bữa tối', icon: '🌙' },
        { key: 'snack', label: 'Ăn phụ / Trước tập', icon: '⚡' }
    ];

    function generateAppIconPng(size) {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#10b981');
            grad.addColorStop(1, '#4f46e5');

            const r = size * 0.22;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(size * 0.56, size * 0.16);
            ctx.lineTo(size * 0.24, size * 0.56);
            ctx.lineTo(size * 0.47, size * 0.56);
            ctx.lineTo(size * 0.42, size * 0.84);
            ctx.lineTo(size * 0.76, size * 0.44);
            ctx.lineTo(size * 0.53, size * 0.44);
            ctx.closePath();
            ctx.fill();

            return canvas.toDataURL('image/png');
        } catch (err) {
            return '';
        }
    }

    function setupPwaAssets() {
        try {
            const icon192 = generateAppIconPng(192);
            const icon512 = generateAppIconPng(512);
            if (icon192) {
                const appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.setAttribute('data-runtime-pwa', '1');
                appleIcon.href = icon192;
                document.head.appendChild(appleIcon);

                const fav = document.createElement('link');
                fav.rel = 'icon';
                fav.type = 'image/png';
                fav.setAttribute('data-runtime-pwa', '1');
                fav.href = icon192;
                document.head.appendChild(fav);

                const manifest = {
                    name: 'NutriGym VN - Dinh Dưỡng & Tập Gym',

    // 4. TRẠNG THÁI ỨNG DỤNG, TỰ ĐỘNG LƯU (INDEXEDDB) & ĐỒNG BỘ ĐÁM MÂY
    // =========================================================================
    function uid(prefix = 'id') {
        return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function getAllFoods() {
        return [...appState.customFoods, ...FOOD_DB];
    }

    function findFoodById(id) {
        return getAllFoods().find(f => f.id === id) || null;
    }

    function findExerciseById(id) {
        return EXERCISES_DB.find(e => e.id === id) || { id, name: id, muscle: 'chest', secondary: [] };
    }

    function buildMealEntryFromFood(food, qty = 1) {
        const q = Math.max(0.25, Math.round(Number(qty || 1) * 4) / 4);
        return {
            entryId: uid('f'),
            foodId: food.id,
            name: food.name,
            unit: food.unit,
            qty: q,
            kcal: Math.round(food.kcal * q),
            p: Math.round(food.p * q * 10) / 10,
            c: Math.round(food.c * q * 10) / 10,
            f: Math.round(food.f * q * 10) / 10,
            price: Math.round((food.price || 0) * q)
        };
    }

    function buildWeekFromPlan(planDays) {
        return planDays.map((dayObj, idx) => {
            const meals = { breakfast: [], lunch: [], dinner: [], snack: [] };
            ['breakfast', 'lunch', 'dinner', 'snack'].forEach(mKey => {
                (dayObj[mKey] || []).forEach(([foodId, qty]) => {
                    const food = FOOD_DB.find(f => f.id === foodId);

    function buildPersistPayload() {
        return {
            version: 4,

    function applyPersistPayload(saved, fromCloud = false) {
        if (!saved || typeof saved !== 'object') return false;
        syncMeta.isApplyingRemote = true;
        try {
            if (saved.profile) appState.profile = { ...appState.profile, ...saved.profile };
            if (!appState.profile.dailyBudget) appState.profile.dailyBudget = 65000;
            if (Array.isArray(saved.customFoods)) appState.customFoods = saved.customFoods;
            const cleanWeek = sanitizeWeekLogs(saved.weekLogs);
            if (cleanWeek) appState.weekLogs = cleanWeek;
            if (Array.isArray(saved.routines) && saved.routines.length > 0) appState.routines = saved.routines;
            if (saved.activeWorkout && Array.isArray(saved.activeWorkout.exercises)) {
                appState.activeWorkout = saved.activeWorkout;
                ensureWorkoutTicker();
            } else if (saved.activeWorkout === null) {
                appState.activeWorkout = null;
            }
            if (Array.isArray(saved.workoutHistory)) appState.workoutHistory = saved.workoutHistory;
            if (Array.isArray(saved.weightHistory)) appState.weightHistory = saved.weightHistory;

            const isDark = saved.theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            const meta = document.getElementById('theme-color-meta');
            if (meta) meta.content = isDark ? '#0f172a' : '#10b981';

            if (saved.updatedAt) {
                syncMeta.lastUpdatedAt = Number(saved.updatedAt) || Date.now();
                syncMeta.lastSavedAt = syncMeta.lastUpdatedAt;
            }
            if (fromCloud) {
                saveToIndexedDB(buildPersistPayload());
            }
            return true;
        } catch (err) {
            console.warn('Không thể áp dụng dữ liệu đã lưu:', err);
            return false;
        } finally {
            syncMeta.isApplyingRemote = false;
        }
    }

    // --- CƠ SỞ DỮ LIỆU TỰ ĐỘNG BỀN VỮNG TRÊN THIẾT BỊ (INDEXEDDB) ---
    function openLocalDB() {
        return new Promise((resolve, reject) => {
            try {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB không khả dụng'));
                    return;
                }
                const req = window.indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            } catch (err) {
                reject(err);
            }
        });
    }

    async function saveToIndexedDB(payload) {
        try {
            const db = await openLocalDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(payload, IDB_KEY);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error);
            });
            return true;
        } catch (err) {
            return false;
        }
    }

    async function loadFromIndexedDB() {
        try {
            const db = await openLocalDB();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        } catch (err) {
            return null;
        }
    }

    function saveStateToStorage(immediate = false) {
        if (syncMeta.isApplyingRemote) return;
        syncMeta.lastUpdatedAt = Date.now();
        const payload = buildPersistPayload();
        syncMeta.status = 'saving';
        updateSyncUI();

        saveToIndexedDB(payload).then((ok) => {
            if (syncMeta.mode !== 'cloud') {
                syncMeta.status = ok ? 'synced' : 'ready';
                syncMeta.lastSavedAt = Date.now();
                syncMeta.note = ok
                    ? 'Mọi thay đổi được tự động lưu bền vững trực tiếp trên điện thoại của bạn.'
                    : 'Đang lưu trong phiên làm việc hiện tại.';
                updateSyncUI();
            }
        });

        const pushCloud = async () => {
            if (window.CloudSyncEngine && window.CloudSyncEngine.isConnected()) {
                const saveId = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
                syncMeta.lastLocalSaveId = saveId;
                const ok = await window.CloudSyncEngine.save(payload, saveId);
                syncMeta.status = ok ? 'synced' : 'error';
                if (ok) {
                    syncMeta.lastSavedAt = Date.now();
                    syncMeta.note = 'Tự động cập nhật lên đám mây thành công.';
                } else {
                    syncMeta.note = 'Chưa kết nối được đám mây, dữ liệu vẫn đã được tự động lưu trên máy.';
                }
                updateSyncUI();
            }
        };

        if (syncMeta.debounceTimer) clearTimeout(syncMeta.debounceTimer);
        if (immediate) {
            pushCloud();
        } else {
            syncMeta.debounceTimer = setTimeout(pushCloud, 650);
        }
    }

    function forceSyncNow() {
        saveStateToStorage(true);
        showToast(
            syncMeta.mode === 'cloud'
                ? '☁️ Đã đồng bộ dữ liệu lên đám mây!'
                : '💾 Đã lưu tự động toàn bộ dữ liệu trên máy!'
        );
    }

    async function loadStateFromStorage() {
        try {
            const localSaved = await loadFromIndexedDB();
            if (localSaved) {
                applyPersistPayload(localSaved, false);
                syncMeta.status = 'synced';
                syncMeta.lastSavedAt = localSaved.updatedAt || Date.now();
                syncMeta.note = 'Đã tự động khôi phục dữ liệu từ bộ nhớ thiết bị.';
            } else {
                await saveToIndexedDB(buildPersistPayload());
                syncMeta.lastSavedAt = Date.now();
                syncMeta.status = 'synced';
                syncMeta.note = 'Tự động lưu trên thiết bị đã sẵn sàng.';
            }
        } catch (err) {
            console.warn('Dùng dữ liệu mặc định:', err);
        }
        if (window.CloudSyncEngine) {
            initCloudBridge();
        }
    }

    function initCloudBridge() {
        if (!window.CloudSyncEngine || window.CloudSyncEngine.started) return;
        window.CloudSyncEngine.init({
            onReady: (uidStr) => {
                syncMeta.mode = 'cloud';
                syncMeta.userId = uidStr;
                syncMeta.status = 'synced';
                syncMeta.note = 'Đám mây đã kết nối — mọi thay đổi tự động đồng bộ tức thì.';
                updateSyncUI();
                if (appState.activeTab === 'profile') renderApp(true);
            },
            onRemoteData: (remotePayload, saveId) => {
                if (!remotePayload) {
                    saveStateToStorage(true);
                    return;
                }
                if (saveId && saveId === syncMeta.lastLocalSaveId) return;
                const remoteTs = Number(remotePayload.updatedAt) || 0;
                if (remoteTs > syncMeta.lastUpdatedAt || syncMeta.lastUpdatedAt === 0) {
                    if (applyPersistPayload(remotePayload, true)) {
                        syncMeta.status = 'synced';
                        syncMeta.lastSavedAt = Date.now();
                        syncMeta.note = 'Đã nhận bản cập nhật mới nhất từ đám mây.';
                        renderApp(true);
                    }
                }
            },
            onFallbackLocal: (reason) => {
                syncMeta.mode = 'local';
                syncMeta.status = 'synced';
                syncMeta.note = reason || 'Dữ liệu đang tự động lưu bền vững ngay trên điện thoại của bạn.';
                updateSyncUI();
            }
        });
    }

    window.onCloudSyncBridgeReady = function () {
        initCloudBridge();
    };

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function normalizeVi(str) {
        return String(str || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .trim();
    }

    function formatVnd(amount) {
        const val = Math.round(Number(amount) || 0);
        return val.toLocaleString('vi-VN') + 'đ';
    }

    function formatShortVnd(amount) {
        const val = Math.round(Number(amount) || 0);
        if (val >= 1000) return Math.round(val / 1000) + 'k';
        return val + 'đ';
    }

    function formatDuration(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function formatShortDate(ts) {
        const d = new Date(ts);
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function calcNutritionTargets() {
        const p = appState.profile;
        const w = Math.max(30, Number(p.weight) || 65);
        const h = Math.max(120, Number(p.height) || 170);
        const age = Math.max(12, Number(p.age) || 23);
        const bmr = p.gender === 'female'
            ? Math.round(10 * w + 6.25 * h - 5 * age - 161)
            : Math.round(10 * w + 6.25 * h - 5 * age + 5);
        const tdee = Math.round(bmr * (Number(p.activity) || 1.55));
        let targetKcal = tdee;
        if (p.goal === 'cut') targetKcal = Math.max(1250, tdee - 400);
        if (p.goal === 'bulk') targetKcal = tdee + 300;

        const proteinG = Math.round(w * (p.goal === 'cut' ? 2.1 : 1.9));
        const fatG = Math.round((targetKcal * 0.25) / 9);
        const carbG = Math.max(60, Math.round((targetKcal - proteinG * 4 - fatG * 9) / 4));
        const bmi = Math.round((w / ((h / 100) * (h / 100))) * 10) / 10;
        const waterTarget = Math.round(w * 35);
        const dailyBudget = Math.max(20000, Number(p.dailyBudget) || 65000);
        const weeklyBudget = dailyBudget * 7;

        return { bmr, tdee, targetKcal, proteinG, carbG, fatG, bmi, waterTarget, dailyBudget, weeklyBudget };
    }

    function getDayTotals(dayIdx) {
        const log = appState.weekLogs[dayIdx] || { waterMl: 0, meals: { breakfast: [], lunch: [], dinner: [], snack: [] } };
        let kcal = 0, p = 0, c = 0, f = 0, cost = 0, count = 0;
        ['breakfast', 'lunch', 'dinner', 'snack'].forEach(k => {
            (log.meals[k] || []).forEach(item => {
                kcal += Number(item.kcal) || 0;
                p += Number(item.p) || 0;
                c += Number(item.c) || 0;
                f += Number(item.f) || 0;
                cost += Number(item.price) || 0;
                count++;
            });
        });
        return {
            kcal: Math.round(kcal),
            p: Math.round(p),
            c: Math.round(c),
            f: Math.round(f),
            cost: Math.round(cost),
            count,
            waterMl: Number(log.waterMl) || 0
        };
    }

    function getWeeklyCostTotal() {
        let total = 0;
        for (let i = 0; i < 7; i++) {
            total += getDayTotals(i).cost;
        }
        return total;
    }

    function calcWeeklyBalance(targets) {
        let pastDiff = 0;
        let loggedPastDays = 0;
        for (let i = 0; i < appState.selectedDay; i++) {
            const dt = getDayTotals(i);
            if (dt.count > 0) {
                pastDiff += (targets.targetKcal - dt.kcal);
                loggedPastDays++;
            }
        }
        const remainingDays = Math.max(1, 7 - appState.selectedDay);
        const adjustmentPerDay = loggedPastDays > 0 ? Math.round(pastDiff / remainingDays) : 0;
        const clampedAdj = Math.max(-350, Math.min(350, adjustmentPerDay));
        return {
            adjustment: clampedAdj,
            adjustedTarget: Math.max(1200, targets.targetKcal + clampedAdj)
        };
    }

    function playRestBeep() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            [0, 0.22].forEach(offset => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.18, ctx.currentTime + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + offset);
                osc.stop(ctx.currentTime + offset + 0.19);
            });
        } catch (err) {
            // Bỏ qua nếu trình duyệt chặn âm thanh tự động
        }
    }

        const el = document.createElement('div');
        el.className = `${colors[type] || colors.success} px-4 py-2.5 rounded-2xl shadow-xl text-sm font-bold text-center animate-fade-up pointer-events-auto max-w-full break-words`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {

            btn.classList.toggle('dark:text-brand-400', active);
            btn.classList.toggle('bg-brand-50', active);
            btn.classList.toggle('dark:bg-brand-500/15', active);
            btn.classList.toggle('text-slate-500', !active);
            btn.classList.toggle('dark:text-slate-400', !active);
        });

        document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
            const active = btn.getAttribute('data-mobile-tab') === appState.activeTab;
            btn.classList.toggle('bg-brand-500', active);
            btn.classList.toggle('text-white', active);
            btn.classList.toggle('bg-slate-100', !active);
            btn.classList.toggle('dark:bg-slate-800', !active);
            btn.classList.toggle('text-slate-700', !active);
            btn.classList.toggle('dark:text-slate-200', !active);
        });

        // Banner buổi tập đang chạy (hiện khi ở tab khác)
        const banner = document.getElementById('active-workout-banner');
        if (banner) {
            if (appState.activeWorkout && appState.activeTab !== 'gym') {
                banner.classList.remove('hidden');
                const bName = document.getElementById('banner-workout-name');
                if (bName) bName.textContent = appState.activeWorkout.name;
                updateWorkoutClockDom();
            } else {
                banner.classList.add('hidden');
            }
        }
    }

    function renderApp(keepScroll = false) {
        const prevY = window.scrollY;
        const main = document.getElementById('main-content');
        if (!main) return;

        try {
            updateNavActiveUI();
            if (appState.activeTab === 'nutrition') {
                main.innerHTML = renderNutritionTab();
            } else if (appState.activeTab === 'gym') {
                main.innerHTML = renderGymTab();
                updateWorkoutClockDom();
                updateRestTimerDom();
            } else if (appState.activeTab === 'muscles') {
                main.innerHTML = renderMusclesTab();
            } else if (appState.activeTab === 'progress') {
                main.innerHTML = renderProgressTab();
            } else {
                main.innerHTML = renderProfileTab();
            }

            if (keepScroll) {
                window.scrollTo(0, prevY);
            }
        } catch (err) {
            console.error('Lỗi hiển thị giao diện:', err);
            main.innerHTML = `
                <div class="p-4 rounded-3xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-200 space-y-2">
                    <p class="font-extrabold">Có lỗi nhỏ khi hiển thị tab này.</p>
                    <p class="text-sm">${escapeHtml(err.message || String(err))}</p>
                    <button type="button" onclick="executeReset('sample_data')" class="min-h-[44px] px-4 rounded-xl bg-rose-600 text-white text-sm font-bold">Khôi phục dữ liệu mẫu</button>
                </div>
            `;
        }
    }

    // =========================================================================
    // 7. TAB 1: DINH DƯỠNG (CHUẨN NUTREE + THỰC ĐƠN KINH TẾ 400K-500K/TUẦN)
    // =========================================================================
    function renderNutritionTab() {
        const targets = calcNutritionTargets();
        const bal = calcWeeklyBalance(targets);
        const dayTotals = getDayTotals(appState.selectedDay);
        const weekCost = getWeeklyCostTotal();

        const effectiveTarget = bal.adjustedTarget;
        const remainingKcal = effectiveTarget - dayTotals.kcal;
        const pct = Math.min(100, Math.round((dayTotals.kcal / Math.max(1, effectiveTarget)) * 100));
        const radius = 44;
        const circumference = Math.round(2 * Math.PI * radius * 10) / 10;
        const strokeOffset = Math.round(circumference * (1 - pct / 100) * 10) / 10;
        const ringColor = remainingKcal < 0 ? '#f43f5e' : '#10b981';

        const pPct = Math.min(100, Math.round((dayTotals.p / Math.max(1, targets.proteinG)) * 100));
        const cPct = Math.min(100, Math.round((dayTotals.c / Math.max(1, targets.carbG)) * 100));
        const fPct = Math.min(100, Math.round((dayTotals.f / Math.max(1, targets.fatG)) * 100));

        const dayBudgetPct = Math.min(100, Math.round((dayTotals.cost / targets.dailyBudget) * 100));
        const weekBudgetPct = Math.min(100, Math.round((weekCost / targets.weeklyBudget) * 100));
        const waterPct = Math.min(100, Math.round((dayTotals.waterMl / Math.max(1, targets.waterTarget)) * 100));

        const dayPillsHtml = DAY_LABELS.map((lbl, idx) => {
            const active = idx === appState.selectedDay;
            const hasFood = getDayTotals(idx).count > 0;
            return `
                <button type="button" onclick="selectDay(${idx})" class="min-h-[46px] flex flex-col items-center justify-center rounded-2xl text-sm font-extrabold transition active:scale-95 ${
                    active
                        ? 'bg-brand-500 text-white shadow-md shadow-brand-500/25'
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }">
                    <span>${lbl}</span>
                    <span class="w-1.5 h-1.5 rounded-full mt-0.5 ${
                        hasFood ? (active ? 'bg-white' : 'bg-brand-500') : 'bg-transparent'
                    }"></span>
                </button>
            `;
        }).join('');

        const mealsHtml = MEAL_META.map(m => {
            const list = appState.weekLogs[appState.selectedDay]?.meals?.[m.key] || [];
            const mealKcal = list.reduce((sum, it) => sum + (Number(it.kcal) || 0), 0);
            const mealCost = list.reduce((sum, it) => sum + (Number(it.price) || 0), 0);

            const itemsHtml = list.length === 0
                ? `<p class="text-sm text-slate-400 dark:text-slate-500 py-2">Chưa ghi món nào cho ${m.label.toLowerCase()}.</p>`
                : list.map(item => `
                    <div class="flex items-center justify-between gap-2 py-2.5 border-t border-slate-100 dark:border-slate-800/80 first:border-t-0">
                        <div class="min-w-0 flex-1">
                            <p class="text-base font-bold text-slate-900 dark:text-white leading-snug break-words">${escapeHtml(item.name)}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                ${item.qty} ${escapeHtml(item.unit)} • <span class="font-bold text-slate-700 dark:text-slate-200">${item.kcal} kcal</span> • Đạm ${item.p}g • ${formatVnd(item.price)}
                            </p>
                        </div>
                        <button type="button" onclick="removeMealEntry('${m.key}','${item.entryId}')" aria-label="Xóa món" class="min-w-[44px] min-h-[44px] shrink-0 rounded-xl bg-rose-50 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400 flex items-center justify-center text-sm font-bold active:scale-95 transition">✕</button>
                    </div>
                `).join('');

            return `
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <div class="min-w-0">
                            <h3 class="text-base font-extrabold flex items-center gap-1.5">
                                <span>${m.icon}</span>
                                <span>${m.label}</span>
                            </h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">${mealKcal} kcal • ${formatVnd(mealCost)}</p>
                        </div>
                        <button type="button" onclick="openFoodPickerModal('${m.key}')" class="min-h-[44px] px-3.5 rounded-xl bg-brand-50 dark:bg-brand-500/15 text-brand-700 dark:text-brand-300 text-sm font-extrabold active:scale-95 transition shrink-0">
                            + Thêm
                        </button>
                    </div>
                    <div>${itemsHtml}</div>
                </section>
            `;
        }).join('');

        return `
            <div class="space-y-4">
                <!-- CHỌN NGÀY TRONG TUẦN -->
                <div class="bg-white dark:bg-slate-900 rounded-3xl p-2 border border-slate-200/80 dark:border-slate-800 shadow-sm grid grid-cols-7 gap-1">
                    ${dayPillsHtml}
                </div>

                <!-- TỔNG QUAN CALO, MACRO & CÂN BẰNG TUẦN -->
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
                    <div class="flex items-center gap-4">
                        <div class="relative w-28 h-28 shrink-0 flex items-center justify-center">
                            <svg class="w-28 h-28 -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="${radius}" fill="none" stroke="currentColor" class="text-slate-100 dark:text-slate-800" stroke-width="9"></circle>
                                <circle cx="50" cy="50" r="${radius}" fill="none" stroke="${ringColor}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${strokeOffset}"></circle>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-1">
                                <span class="text-xl font-black leading-none ${remainingKcal < 0 ? 'text-rose-500' : 'text-slate-900 dark:text-white'}">${Math.abs(remainingKcal)}</span>
                                <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 mt-0.5">${remainingKcal < 0 ? 'vượt kcal' : 'kcal còn lại'}</span>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0 space-y-2">
                            <div class="flex items-baseline justify-between gap-1 flex-wrap">
                                <span class="text-sm font-bold text-slate-500 dark:text-slate-400">Đã nạp (${DAY_LABELS[appState.selectedDay]})</span>
                                <span class="text-base font-black text-slate-900 dark:text-white">${dayTotals.kcal} / ${effectiveTarget} kcal</span>
                            </div>

                            <div class="px-3 py-1.5 rounded-xl bg-brand-50 dark:bg-brand-500/15 border border-brand-200/70 dark:border-brand-500/25 flex items-center justify-between gap-2 text-xs">
                                <span class="font-bold text-brand-800 dark:text-brand-300">⚖️ Cân bằng tuần</span>
                                <span class="font-extrabold ${bal.adjustment < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-brand-700 dark:text-brand-300'}">${bal.adjustment >= 0 ? '+' : ''}${bal.adjustment} kcal/ngày</span>
                            </div>

                            <div class="grid grid-cols-2 gap-2 pt-0.5">
                                <button type="button" onclick="openBudgetMenuModal()" class="min-h-[44px] px-2.5 rounded-xl bg-amber-50 dark:bg-amber-500/15 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-500/30 text-xs sm:text-sm font-extrabold active:scale-95 transition">
                                    💰 Thực đơn kinh tế
                                </button>
                                <button type="button" onclick="openFoodPickerModal('lunch')" class="min-h-[44px] px-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs sm:text-sm font-extrabold active:scale-95 transition">
                                    + Thêm món ăn
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 3 THANH MACRO -->
                    <div class="grid grid-cols-3 gap-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                        <div>
                            <div class="flex items-center justify-between text-xs mb-1">
                                <span class="font-bold text-brand-600 dark:text-brand-400">Đạm (P)</span>
                                <span class="font-extrabold">${dayTotals.p}/${targets.proteinG}g</span>
                            </div>
                            <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                                <div class="h-full bg-brand-500 rounded-full" style="width:${pPct}%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between text-xs mb-1">
                                <span class="font-bold text-sky-600 dark:text-sky-400">Tinh bột (C)</span>
                                <span class="font-extrabold">${dayTotals.c}/${targets.carbG}g</span>
                            </div>
                            <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                                <div class="h-full bg-sky-500 rounded-full" style="width:${cPct}%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between text-xs mb-1">
                                <span class="font-bold text-amber-600 dark:text-amber-400">Béo (F)</span>
                                <span class="font-extrabold">${dayTotals.f}/${targets.fatG}g</span>
                            </div>
                            <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                                <div class="h-full bg-amber-500 rounded-full" style="width:${fPct}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- THEO DÕI CHI PHÍ NGÀY & TUẦN -->
                    <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-700/80 space-y-2">
                        <div class="flex items-center justify-between gap-2 text-xs sm:text-sm">
                            <span class="font-bold text-slate-600 dark:text-slate-300">💵 Chi phí hôm nay (${DAY_LABELS[appState.selectedDay]})</span>
                            <span class="font-extrabold ${dayTotals.cost > targets.dailyBudget ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'}">${formatVnd(dayTotals.cost)} / ${formatVnd(targets.dailyBudget)}</span>
                        </div>
                        <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                            <div class="h-full rounded-full ${dayTotals.cost > targets.dailyBudget ? 'bg-rose-500' : 'bg-emerald-500'}" style="width:${dayBudgetPct}%"></div>
                        </div>
                        <div class="flex items-center justify-between gap-2 text-xs pt-0.5">
                            <span class="font-semibold text-slate-500 dark:text-slate-400">📅 Tổng chi cả tuần (T2–CN):</span>
                            <span class="font-extrabold ${weekCost > targets.weeklyBudget ? 'text-rose-600 dark:text-rose-400' : 'text-slate-800 dark:text-slate-100'}">${formatVnd(weekCost)} / ${formatVnd(targets.weeklyBudget)} (${weekBudgetPct}%)</span>
                        </div>
                    </div>
                </section>

                <!-- NHẬP BỮA ĂN NHANH BẰNG TIẾNG VIỆT -->
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                        <h3 class="text-base font-extrabold">⚡ Nhập nhanh bằng chữ</h3>
                        <select id="quick-meal-select" class="min-h-[44px] px-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-bold border-0">
                            <option value="breakfast">Bữa sáng</option>
                            <option value="lunch" selected>Bữa trưa</option>
                            <option value="dinner">Bữa tối</option>
                            <option value="snack">Ăn phụ</option>
                        </select>
                    </div>
                    <form onsubmit="handleQuickLogSubmit(event)" class="flex gap-2">
                        <input id="quick-food-input" type="text" placeholder="VD: 1 bún chả hà nội, 2 quả trứng luộc..." class="flex-1 min-w-0 min-h-[46px] px-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base border border-transparent focus:border-brand-500 outline-none">
                        <button type="submit" class="min-h-[46px] px-4 rounded-xl bg-slate-900 dark:bg-brand-500 text-white text-sm font-extrabold shrink-0 active:scale-95 transition">Ghi</button>
                    </form>
                </section>

                <!-- THEO DÕI NƯỚC UỐNG -->
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <h3 class="text-base font-extrabold">💧 Nước uống hôm nay</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">${dayTotals.waterMl} / ${targets.waterTarget} ml (${waterPct}%)</p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="addWater(-250)" class="min-w-[44px] min-h-[44px] rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-extrabold active:scale-95 transition">-250</button>
                            <button type="button" onclick="addWater(250)" class="min-h-[44px] px-3 rounded-xl bg-sky-50 dark:bg-sky-500/15 text-sky-700 dark:text-sky-300 text-sm font-extrabold active:scale-95 transition">+250ml</button>
                            <button type="button" onclick="addWater(500)" class="min-h-[44px] px-3 rounded-xl bg-sky-500 text-white text-sm font-extrabold active:scale-95 transition">+500ml</button>
                        </div>
                    </div>
                    <div class="h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                        <div class="h-full bg-sky-500 rounded-full transition-all" style="width:${waterPct}%"></div>
                    </div>
                </section>

                <!-- DANH SÁCH 4 BỮA TRONG NGÀY -->
                <div class="space-y-3">
                    ${mealsHtml}
                </div>
            </div>
        `;
    }

    function selectDay(idx) {
        appState.selectedDay = idx;
        renderApp(true);
    }

    function addWater(delta) {
        const log = appState.weekLogs[appState.selectedDay];
        if (!log) return;
        log.waterMl = Math.max(0, (Number(log.waterMl) || 0) + delta);
        saveStateToStorage();
        renderApp(true);
    }

    function removeMealEntry(mealKey, entryId) {
        const log = appState.weekLogs[appState.selectedDay];
        if (!log || !log.meals[mealKey]) return;
        log.meals[mealKey] = log.meals[mealKey].filter(item => item.entryId !== entryId);
        saveStateToStorage();
        renderApp(true);
        showToast('Đã xóa món khỏi bữa ăn', 'info');
    }

    function handleQuickLogSubmit(e) {
        e.preventDefault();
        const input = document.getElementById('quick-food-input');
        const sel = document.getElementById('quick-meal-select');
        const raw = (input ? input.value : '').trim();
        const mealKey = sel ? sel.value : 'lunch';
        if (!raw) return;

        const segments = raw.split(/[,+;]+/).map(s => s.trim()).filter(Boolean);
        const allFoods = getAllFoods();
        let added = 0;

        segments.forEach(seg => {
            const matchQty = seg.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
            let qty = 1;
            let textPart = seg;
            if (matchQty) {
                qty = parseFloat(matchQty[1].replace(',', '.')) || 1;
                textPart = matchQty[2] || '';
            }
            const cleanQuery = normalizeVi(textPart)
                .replace(/^(to|bat|chen|dia|phan|suat|qua|trai|ly|coc|hop|mieng|goi|cai|cu|muong|o)\s+/g, '')
                .trim();

            if (!cleanQuery) return;
            const found = allFoods.find(f => normalizeVi(f.name).includes(cleanQuery))
                || allFoods.find(f => cleanQuery.split(/\s+/).every(w => normalizeVi(f.name).includes(w)));

            if (found) {
                appState.weekLogs[appState.selectedDay].meals[mealKey].push(buildMealEntryFromFood(found, qty));
                added++;
            }
        });

        if (added > 0) {
            if (input) input.value = '';
            saveStateToStorage();
            renderApp(true);
            showToast(`✅ Đã ghi nhanh ${added} món ăn!`);
        } else {
            showToast('Chưa khớp món trong kho — hãy bấm "+ Thêm món ăn" để chọn hoặc tự tạo nhé!', 'warning');
        }
    }

    // --- MODAL CHỌN MÓN & TỰ TẠO MÓN ĂN ---
    function openFoodPickerModal(mealKey = 'lunch') {
        foodPickerState = { mealKey, cat: 'all', query: '' };
        const mealTitle = (MEAL_META.find(m => m.key === mealKey) || MEAL_META[1]).label;
        openModal(`Thêm món vào ${mealTitle}`, `
            <div class="space-y-3">
                <input id="food-search-input" type="text" oninput="filterFoodList()" placeholder="Tìm bún chả, cơm sườn, ức gà, trứng..." class="w-full min-h-[46px] px-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base border border-transparent focus:border-brand-500 outline-none">
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    ${[
                        ['all', 'Tất cả'],
                        ['quan', '🍜 Quán quen 30-33k'],
                        ['cook', '🍳 Tự nấu giá rẻ'],
                        ['viet', 'Món Việt'],
                        ['protein', 'Đạm cao'],
                        ['snack', 'Phụ / Uống']
                    ].map(([k, l]) => `
                        <button type="button" onclick="setFoodCat('${k}')" data-fcat="${k}" class="fcat-btn min-h-[44px] px-3 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                            k === 'all' ? 'bg-brand-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                        }">${l}</button>
                    `).join('')}
                </div>
                <button type="button" onclick="openCustomFoodForm('${mealKey}')" class="w-full min-h-[44px] py-2 rounded-xl border border-dashed border-brand-400 text-brand-700 dark:text-brand-300 text-sm font-extrabold">
                    + Tự tạo món ăn & giá tiền riêng
                </button>
                <div id="food-picker-list" class="space-y-2"></div>
            </div>
        `);
        filterFoodList();
    }

    function setFoodCat(cat) {
        foodPickerState.cat = cat;
        document.querySelectorAll('.fcat-btn').forEach(btn => {
            const active = btn.getAttribute('data-fcat') === cat;
            btn.className = `fcat-btn min-h-[44px] px-3 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                active ? 'bg-brand-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
            }`;
        });
        filterFoodList();
    }

    function filterFoodList() {
        const listEl = document.getElementById('food-picker-list');
        if (!listEl) return;
        const inputEl = document.getElementById('food-search-input');
        const q = normalizeVi(inputEl ? inputEl.value : '');
        const cat = foodPickerState.cat;

        const filtered = getAllFoods().filter(f => {
            const matchCat = cat === 'all' || f.cat === cat;
            const matchQ = !q || normalizeVi(f.name).includes(q);
            return matchCat && matchQ;
        });

        if (filtered.length === 0) {
            listEl.innerHTML = `<p class="text-center text-sm text-slate-400 py-6">Không tìm thấy món phù hợp.</p>`;
            return;
        }

        listEl.innerHTML = filtered.map(f => `
            <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-700 flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1">
                    <p class="text-sm sm:text-base font-bold leading-snug break-words">${escapeHtml(f.name)}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        1 ${escapeHtml(f.unit)} • <b>${f.kcal} kcal</b> • P:${f.p}g C:${f.c}g F:${f.f}g • <span class="text-emerald-600 dark:text-emerald-400 font-bold">${formatVnd(f.price)}</span>

    function generateMenuForDailyBudget(budgetVnd) {
        const b = Math.max(35000, Number(budgetVnd) || 65000);
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        let breakfast, lunch, dinner, snack;
        if (b <= 55000) {
            breakfast = pick([
                [['trung_luoc', 2], ['khoai_lang', 1]],
                [['yen_mach', 1], ['trung_luoc', 2]],
                [['trung_luoc', 2], ['chuoi', 1], ['sua_dau_nanh', 1]]
            ]);
            lunch = pick([
                [['com_trang', 2], ['uc_ga_150', 1], ['rau_luoc', 1]],
                [['com_trang', 2], ['dui_ga_bo_da', 1], ['rau_luoc', 1]],
                [['com_trang', 2], ['ca_nuc_150', 1], ['rau_luoc', 1]]
            ]);
            dinner = pick([
                [['com_trang', 1.5], ['ca_basa_150', 1], ['rau_luoc', 1]],
                [['com_trang', 1.5], ['dau_hu', 1], ['trung_luoc', 2], ['rau_luoc', 1]]
            ]);
            snack = [['chuoi', 1]];
        } else if (b <= 80000) {
            const eatOutMorning = Math.random() < 0.5;
            if (eatOutMorning) {
                breakfast = [['bun_cha_hn', 1]];
                lunch = pick([
                    [['com_trang', 2], ['uc_ga_150', 1], ['rau_luoc', 1]],
                    [['com_trang', 2], ['dui_ga_bo_da', 1], ['rau_luoc', 1]]
                ]);
                dinner = pick([
                    [['com_trang', 1.5], ['ca_basa_150', 1], ['rau_luoc', 1]],
                    [['com_trang', 1.5], ['dau_hu', 1], ['trung_luoc', 2], ['rau_luoc', 1]]
                ]);
            } else {
                breakfast = pick([
                    [['trung_luoc', 2], ['khoai_lang', 1], ['sua_dau_nanh', 1]],
                    [['yen_mach', 1], ['trung_luoc', 2]]
                ]);
                lunch = pick([[['com_ga', 1]], [['com_suon', 1]]]);
                dinner = pick([
                    [['com_trang', 1.5], ['uc_ga_150', 1], ['rau_luoc', 1]],
                    [['com_trang', 1.5], ['ca_nuc_150', 1], ['rau_luoc', 1]]
                ]);
            }
            snack = pick([[['chuoi', 1], ['dau_phong', 1]], [['chuoi', 1], ['sua_dau_nanh', 1]]]);
        } else if (b <= 115000) {
            breakfast = pick([[['bun_cha_hn', 1]], [['pho_bo', 1]], [['banh_mi_thit', 1], ['trung_luoc', 1]]]);
            lunch = pick([[['com_ga', 1]], [['com_suon', 1]], [['com_trang', 2], ['thit_bo_xao', 1], ['rau_luoc', 1]]]);
            dinner = pick([[['com_trang', 1.5], ['uc_ga_150', 1], ['rau_luoc', 1]], [['com_trang', 1.5], ['tom_luoc', 1], ['rau_luoc', 1]]]);
            snack = pick([[['whey_1scoop', 1], ['chuoi', 1]], [['sua_tuoi_kd', 1], ['chuoi', 1]]]);
        } else {
            breakfast = [['pho_bo', 1], ['trung_luoc', 1]];
            lunch = [['com_gao_lut', 1.5], ['ca_hoi', 1], ['rau_luoc', 1]];
            dinner = [['khoai_lang', 1], ['thit_bo_xao', 1], ['rau_luoc', 1]];
            snack = [['whey_1scoop', 1], ['sua_chua_kh', 1], ['chuoi', 1]];
        }

        const meals = { breakfast, lunch, dinner, snack };
        let kcal = 0, p = 0, cost = 0;
        const summaryLines = [];
        MEAL_META.forEach(m => {
            const names = [];
            (meals[m.key] || []).forEach(([id, q]) => {
                const f = FOOD_DB.find(x => x.id === id);
                if (!f) return;
                kcal += Math.round(f.kcal * q);
                p += Math.round(f.p * q);
                cost += Math.round((f.price || 0) * q);
                names.push(`${q === 1 ? '' : q + ' '}${f.name}`);
            });
            summaryLines.push(`${m.icon} <b>${m.label}:</b> ${names.join(' + ')}`);
        });

        return { budget: b, meals, kcal, p, cost, summaryLines };
    }

    function calcEpley1RM(weight, reps) {
        const w = Number(weight) || 0;
        const r = Number(reps) || 0;
        if (w <= 0 || r <= 0) return 0;
        if (r === 1) return Math.round(w);
        return Math.round(w * (1 + r / 30));
    }

    function calcActiveWorkoutStats() {
        const aw = appState.activeWorkout;
        if (!aw) return { doneSets: 0, totalSets: 0, volume: 0 };
        let doneSets = 0, totalSets = 0, volume = 0;
        aw.exercises.forEach(ex => {
            ex.sets.forEach(s => {
                totalSets++;
                if (s.done) {
                    doneSets++;
                    volume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
                }
            });
        });
        return { doneSets, totalSets, volume: Math.round(volume) };
    }

    function ensureWorkoutTicker() {
        if (workoutTickInterval) clearInterval(workoutTickInterval);
        if (!appState.activeWorkout) return;
        workoutTickInterval = setInterval(updateWorkoutClockDom, 1000);
    }

    function updateWorkoutClockDom() {
        if (!appState.activeWorkout) return;
        const elapsedSec = Math.max(0, Math.floor((Date.now() - appState.activeWorkout.startTime) / 1000));
        const str = formatDuration(elapsedSec);
        const mainClock = document.getElementById('active-workout-clock');
        if (mainClock) mainClock.textContent = str;
        const bannerClock = document.getElementById('banner-workout-timer');
        if (bannerClock) bannerClock.textContent = str;
    }

    function startRestTimer(seconds = 90) {
        if (restTimerState.intervalId) clearInterval(restTimerState.intervalId);
        restTimerState.total = seconds;
        restTimerState.endTime = Date.now() + seconds * 1000;
        restTimerState.remaining = seconds;
        restTimerState.running = true;
        updateRestTimerDom();

        restTimerState.intervalId = setInterval(() => {
            const left = Math.ceil((restTimerState.endTime - Date.now()) / 1000);
            if (left <= 0) {
                stopRestTimer(true);
            } else {
                restTimerState.remaining = left;
                updateRestTimerDom();
            }
        }, 300);
    }

    function adjustRestTimer(deltaSec) {
        if (!restTimerState.running) {
            startRestTimer(Math.max(15, deltaSec));
            return;
        }
        restTimerState.endTime = Math.max(Date.now() + 1000, restTimerState.endTime + deltaSec * 1000);
        restTimerState.remaining = Math.ceil((restTimerState.endTime - Date.now()) / 1000);
        updateRestTimerDom();
    }

    function stopRestTimer(finished = false) {
        if (restTimerState.intervalId) {
            clearInterval(restTimerState.intervalId);
            restTimerState.intervalId = null;
        }
        restTimerState.running = false;
        restTimerState.remaining = 0;
        updateRestTimerDom();
        if (finished) {
            playRestBeep();
            showToast('🔔 Hết giờ nghỉ! Vào hiệp tiếp theo thôi!', 'info');
        }
    }

    function updateRestTimerDom() {
        const el = document.getElementById('rest-timer-display');
        if (!el) return;
        el.textContent = restTimerState.running ? formatDuration(restTimerState.remaining) : 'Sẵn sàng';
    }

    function startRoutineWorkout(routineId) {
        const rt = appState.routines.find(r => r.id === routineId);
        const name = rt ? rt.name : 'Buổi tập tự do';
        const exercises = rt
            ? rt.exercises.map(ex => ({
                uid: uid('wex'),
                exerciseId: ex.exerciseId,
                sets: Array.from({ length: Math.max(1, ex.sets || 3) }, () => ({
                    id: uid('set'),
                    type: 'N',
                    weight: ex.weight ?? 20,
                    reps: ex.reps ?? 10,
                    rpe: 8,
                    done: false
                }))
            }))
            : [];

        appState.activeWorkout = {
            id: uid('aw'),
            name,
            startTime: Date.now(),
            exercises
        };
        ensureWorkoutTicker();
        saveStateToStorage();
        renderApp(false);
        showToast(`🔥 Bắt đầu buổi tập: ${name}`);
    }

        return `

                <!-- HEADER BUỔI TẬP ĐANG DIỄN RA -->
                <section class="p-4 rounded-3xl bg-slate-900 dark:bg-slate-900 border border-slate-800 text-white space-y-3">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <p class="text-xs text-brand-400 font-bold uppercase">Đang tập luyện</p>
                            <h2 class="text-lg font-black leading-tight break-words">${escapeHtml(aw.name)}</h2>
                        </div>
                        <span id="active-workout-clock" class="px-3 py-1 rounded-xl bg-white/10 font-mono text-base font-extrabold shrink-0">00:00</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="p-2.5 rounded-2xl bg-white/10">
                            <p class="text-xs opacity-75">Hiệp hoàn thành</p>
                            <p id="aw-done-sets" class="text-lg font-black">${stats.doneSets} / ${stats.totalSets}</p>
                        </div>
                        <div class="p-2.5 rounded-2xl bg-white/10">
                            <p class="text-xs opacity-75">Tổng khối lượng</p>
                            <p id="aw-total-vol" class="text-lg font-black">${stats.volume.toLocaleString('vi-VN')} kg</p>

                        </div>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button type="button" onclick="startRestTimer(60)" class="min-h-[44px] rounded-xl bg-white/15 text-xs font-extrabold">60s</button>
                            <button type="button" onclick="startRestTimer(90)" class="min-h-[44px] rounded-xl bg-white/15 text-xs font-extrabold">90s</button>
                            <button type="button" onclick="adjustRestTimer(15)" class="min-h-[44px] rounded-xl bg-white/15 text-xs font-extrabold">+15s</button>

                    <div class="grid grid-cols-2 gap-2">

                <div class="space-y-3">${exHtml}</div>

                <button type="button" onclick="openAddExerciseToWorkoutModal()" class="w-full min-h-[48px] rounded-2xl border-2 border-dashed border-gym-400 text-gym-700 dark:text-gym-300 text-base font-extrabold active:scale-95 transition">
                    + Thêm bài tập vào buổi này
                </button>
            </div>
        `;
    }

    function updateSetField(exIdx, setIdx, field, rawVal) {
        const aw = appState.activeWorkout;
        if (!aw || !aw.exercises[exIdx] || !aw.exercises[exIdx].sets[setIdx]) return;
        aw.exercises[exIdx].sets[setIdx][field] = Math.max(0, parseFloat(rawVal) || 0);

        // Cập nhật trực tiếp 1RM & tổng volume mà KHÔNG render lại để tránh nhảy cuộn / tắt bàn phím
        const best1RM = aw.exercises[exIdx].sets.reduce((mx, s) => Math.max(mx, calcEpley1RM(s.weight, s.reps)), 0);
        const rmEl = document.getElementById(`ex-1rm-${exIdx}`);
        if (rmEl) rmEl.innerHTML = `Ước tính 1RM tốt nhất: <b>${best1RM} kg</b>`;

        const stats = calcActiveWorkoutStats();
        const volEl = document.getElementById('aw-total-vol');
        if (volEl) volEl.textContent = `${stats.volume.toLocaleString('vi-VN')} kg`;
        saveStateToStorage();
    }

    function cycleSetType(exIdx, setIdx) {
        const order = ['N', 'W', 'D', 'F'];
        const s = appState.activeWorkout?.exercises[exIdx]?.sets[setIdx];
        if (!s) return;
        s.type = order[(order.indexOf(s.type) + 1) % order.length];
        saveStateToStorage();
        renderApp(true);
    }

    function toggleSetDone(exIdx, setIdx) {
        const s = appState.activeWorkout?.exercises[exIdx]?.sets[setIdx];
        if (!s) return;
        s.done = !s.done;
        if (s.done) startRestTimer(90);
        saveStateToStorage();
        renderApp(true);
    }

    function addSetToEx(exIdx) {
        const ex = appState.activeWorkout?.exercises[exIdx];
        if (!ex) return;
        const last = ex.sets[ex.sets.length - 1] || { weight: 20, reps: 10 };
        ex.sets.push({ id: uid('set'), type: 'N', weight: last.weight, reps: last.reps, rpe: 8, done: false });
        saveStateToStorage();
        renderApp(true);
    }

    function removeSetFromEx(exIdx, setIdx) {
        const ex = appState.activeWorkout?.exercises[exIdx];
        if (!ex) return;
        if (ex.sets.length <= 1) {
            showToast('Mỗi bài cần giữ ít nhất 1 hiệp (hoặc bấm ✕ góc trên để bỏ bài)', 'info');
            return;
        }
        ex.sets.splice(setIdx, 1);
        saveStateToStorage();
        renderApp(true);
    }

    function removeExerciseFromWorkout(exIdx) {
        if (!appState.activeWorkout) return;
        appState.activeWorkout.exercises.splice(exIdx, 1);
        saveStateToStorage();
        renderApp(true);
    }

    function openAddExerciseToWorkoutModal() {
        openModal('Thêm bài tập vào buổi tập', `
            <div class="space-y-2">
                ${EXERCISES_DB.map(ex => `
                    <button type="button" onclick="addExerciseToActive('${ex.id}')" class="w-full min-h-[48px] p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 hover:bg-gym-50 dark:hover:bg-gym-500/15 text-left flex items-center justify-between gap-2 transition">
                        <span class="text-sm sm:text-base font-bold">${escapeHtml(ex.name)}</span>
                        <span class="text-xs font-extrabold text-gym-600 dark:text-gym-400 shrink-0">${(MUSCLE_GROUPS[ex.muscle] || {}).name || ''}</span>
                    </button>
                `).join('')}
            </div>
        `);
    }

    function addExerciseToActive(exerciseId) {
        if (!appState.activeWorkout) return;
        appState.activeWorkout.exercises.push({
            uid: uid('wex'),
            exerciseId,
            sets: [
                { id: uid('set'), type: 'N', weight: 20, reps: 10, rpe: 8, done: false },
                { id: uid('set'), type: 'N', weight: 20, reps: 10, rpe: 8, done: false },
                { id: uid('set'), type: 'N', weight: 20, reps: 10, rpe: 8, done: false }
            ]
        });
        closeModal();
        saveStateToStorage();
        renderApp(true);
        showToast('✅ Đã thêm bài tập mới!');
    }

    function finishActiveWorkout() {
        const aw = appState.activeWorkout;
        if (!aw) return;
        const stats = calcActiveWorkoutStats();
        const muscleSet = new Set();
        aw.exercises.forEach(ex => {
            const info = findExerciseById(ex.exerciseId);
            if (info.muscle) muscleSet.add(info.muscle);
            (info.secondary || []).forEach(m => muscleSet.add(m));
        });

        appState.workoutHistory.unshift({
            id: uid('wh'),
            name: aw.name,
            date: Date.now(),
            durationSec: Math.max(60, Math.floor((Date.now() - aw.startTime) / 1000)),
            totalVolume: stats.volume,
            totalSets: stats.doneSets || stats.totalSets,
            muscles: Array.from(muscleSet)
        });

        stopRestTimer(false);
        appState.activeWorkout = null;
        if (workoutTickInterval) clearInterval(workoutTickInterval);
        saveStateToStorage(true);
        renderApp(false);
        showToast(`🏆 Hoàn thành buổi tập! Tổng khối lượng ${stats.volume.toLocaleString('vi-VN')} kg!`);
    }

    function confirmCancelWorkout() {
        openModal('Hủy buổi tập đang chạy?', `
            <div class="space-y-4">
                <p class="text-slate-600 dark:text-slate-300">Buổi tập hiện tại sẽ không được lưu vào lịch sử.</p>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" onclick="closeModal()" class="min-h-[48px] rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Tiếp tục tập</button>
                    <button type="button" onclick="cancelActiveWorkout()" class="min-h-[48px] rounded-xl bg-rose-600 text-white font-extrabold">Hủy buổi</button>
                </div>
            </div>
        `);
    }

    function cancelActiveWorkout() {
        stopRestTimer(false);
        appState.activeWorkout = null;
        if (workoutTickInterval) clearInterval(workoutTickInterval);
        closeModal();
        saveStateToStorage();
        renderApp(false);
        showToast('Đã hủy buổi tập', 'info');
    }

    function deleteWorkoutHistory(whId) {
        appState.workoutHistory = appState.workoutHistory.filter(w => w.id !== whId);
        saveStateToStorage();
        renderApp(true);
        showToast('Đã xóa bản ghi buổi tập', 'info');
    }

    function openCreateRoutineModal() {
        openModal('Tạo giáo án tập mới', `
            <form onsubmit="saveCustomRoutine(event)" class="space-y-3">
                <div>
                    <label class="text-sm font-bold block mb-1">Tên giáo án</label>
                    <input id="cr-name" required placeholder="VD: Ngực & Tay trước, Vai & Bụng..." class="w-full min-h-[46px] px-3.5 rounded-xl bg-slate-100 dark:bg-slate-800">
                </div>
                <div>
                    <label class="text-sm font-bold block mb-1.5">Chọn các bài tập:</label>
                    <div class="space-y-1.5 max-h-60 overflow-y-auto modal-scroll-area pr-1">
                        ${EXERCISES_DB.map(ex => `
                            <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 min-h-[44px] cursor-pointer">
                                <input type="checkbox" name="cr_ex" value="${ex.id}" class="w-5 h-5 accent-brand-500">
                                <span class="text-sm font-semibold">${escapeHtml(ex.name)}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <button type="submit" class="w-full min-h-[48px] rounded-xl bg-gym-600 text-white text-base font-extrabold">Lưu giáo án</button>
            </form>

    function saveCustomRoutine(e) {
        e.preventDefault();
        const name = document.getElementById('cr-name').value.trim();
        const checked = Array.from(document.querySelectorAll('input[name="cr_ex"]:checked')).map(el => el.value);
        if (checked.length === 0) {
            showToast('Hãy chọn ít nhất 1 bài tập nhé!', 'warning');
            return;
        }
        appState.routines.unshift({
            id: 'rt_custom_' + Date.now(),
            name,
            color: 'indigo',
            exercises: checked.map(exId => ({ exerciseId: exId, sets: 3, reps: 10, weight: 20 }))
        });
        closeModal();
        saveStateToStorage();
        renderApp(true);
        showToast(`✅ Đã tạo giáo án "${name}"!`);
    }

    function deleteCustomRoutine(rtId) {
        appState.routines = appState.routines.filter(r => r.id !== rtId);
        saveStateToStorage();
        renderApp(true);
        showToast('Đã xóa giáo án', 'info');
    }

    // =========================================================================
    // 9. TAB 3: BẢN ĐỒ PHỤC HỒI CƠ BẮP TƯƠNG TÁC (SVG)
    // =========================================================================
    function getMuscleRecovery(muscleKey) {
        const meta = MUSCLE_GROUPS[muscleKey] || { name: muscleKey, recoverHours: 48 };
        let lastTrained = 0;
        appState.workoutHistory.forEach(wh => {
            if (Array.isArray(wh.muscles) && wh.muscles.includes(muscleKey)) {
                lastTrained = Math.max(lastTrained, Number(wh.date) || 0);
            }
        });
        if (!lastTrained) {
            return { pct: 100, hoursAgo: null, status: 'Sẵn sàng tập', color: '#10b981', badgeClass: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300' };
        }
        const hoursAgo = Math.max(0, Math.round((Date.now() - lastTrained) / 3600000));
        const pct = Math.min(100, Math.round((hoursAgo / meta.recoverHours) * 100));
        if (pct < 50) {
            return { pct, hoursAgo, status: 'Đang mỏi — nên nghỉ', color: '#f43f5e', badgeClass: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300' };
        }
        if (pct < 85) {
            return { pct, hoursAgo, status: 'Đang phục hồi', color: '#f59e0b', badgeClass: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300' };
        }
        return { pct, hoursAgo, status: 'Sẵn sàng tập', color: '#10b981', badgeClass: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300' };
    }

    function renderProgressTab() {
        const targets = calcNutritionTargets();
        const history = [...appState.weightHistory].sort((a, b) => a.date - b.date);
        const latest = history[history.length - 1];
        const currentW = latest ? latest.weight : appState.profile.weight;

        let chartHtml = `<p class="text-sm text-slate-400 text-center py-8">Chưa có đủ dữ liệu cân nặng. Hãy bấm <b>+ Ghi cân nặng</b> để vẽ biểu đồ nhé!</p>`;
        if (history.length >= 2) {
            const weights = history.map(h => Number(h.weight) || 0);
            const minW = Math.min(...weights) - 1;
            const maxW = Math.max(...weights) + 1;
            const range = Math.max(1, maxW - minW);
            const W = 320, H = 140, padX = 22, padY = 18;
            const pts = history.map((h, i) => {
                const x = padX + (i / (history.length - 1)) * (W - padX * 2);
                const y = H - padY - (((Number(h.weight) || minW) - minW) / range) * (H - padY * 2);
                return { x: Math.round(x), y: Math.round(y), w: h.weight, d: formatShortDate(h.date) };
            });
            const poly = pts.map(p => `${p.x},${p.y}`).join(' ');
            chartHtml = `
                <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">
                    <polyline fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>
                    ${pts.map(p => `
                        <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
                        <text x="${p.x}" y="${p.y - 9}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">${p.w}</text>
                        <text x="${p.x}" y="${H - 3}" text-anchor="middle" font-size="9" fill="#94a3b8">${p.d}</text>
                    `).join('')}
                </svg>
            `;
        } else if (history.length === 1) {
            chartHtml = `<p class="text-sm text-slate-500 text-center py-6">Đã có 1 mốc (${history[0].weight} kg). Thêm ít nhất 1 mốc nữa để vẽ đường xu hướng nhé!</p>`;
        }

        return `
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                        <p class="text-xs font-bold text-slate-500">Cân nặng hiện tại</p>
                        <p class="text-2xl font-black text-brand-600 dark:text-brand-400 mt-1">${currentW} kg</p>
                        <p class="text-xs text-slate-400">Mục tiêu: ${appState.profile.targetWeight} kg</p>
                    </div>
                    <div class="p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                        <p class="text-xs font-bold text-slate-500">Chỉ số BMI / Tập luyện</p>
                        <p class="text-2xl font-black text-gym-600 dark:text-gym-400 mt-1">${targets.bmi}</p>
                        <p class="text-xs text-slate-400">${appState.workoutHistory.length} buổi tập đã lưu</p>
                    </div>
                </div>

                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <h3 class="text-base font-extrabold">📈 Biểu đồ cân nặng</h3>
                        <button type="button" onclick="openAddWeightModal()" class="min-h-[44px] px-3.5 rounded-xl bg-brand-500 text-white text-sm font-extrabold active:scale-95 transition">+ Ghi cân nặng</button>
                    </div>
                    <div class="w-full overflow-hidden">${chartHtml}</div>
                </section>

                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-2.5">
                    <h3 class="text-base font-extrabold">📝 Lịch sử cân nặng & vòng eo</h3>
                    ${history.length === 0 ? `<p class="text-sm text-slate-400">Chưa có bản ghi nào.</p>` : [...history].reverse().map(item => `
                        <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70">
                            <div>
                                <p class="text-base font-extrabold">${item.weight} kg ${item.waist ? `• Eo ${item.waist} cm` : ''}</p>
                                <p class="text-xs text-slate-500">${formatShortDate(item.date)}</p>
                            </div>
                            <button type="button" onclick="deleteWeightEntry('${item.id}')" aria-label="Xóa mốc cân nặng" class="min-w-[44px] min-h-[44px] rounded-xl bg-rose-50 dark:bg-rose-500/15 text-rose-600 text-sm font-bold">✕</button>
                        </div>
                    `).join('')}
                </section>
            </div>
        `;
    }

    function openAddWeightModal() {
        openModal('Ghi cân nặng & vòng eo hôm nay', `
            <form onsubmit="saveWeightEntry(event)" class="space-y-3.5">
                <div>
                    <label class="text-sm font-bold block mb-1">Cân nặng (kg)</label>
                    <input id="nw-weight" type="number" step="0.1" min="25" max="250" value="${appState.profile.weight}" required class="w-full min-h-[48px] px-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">
                </div>
                <div>
                    <label class="text-sm font-bold block mb-1">Vòng eo (cm - tùy chọn)</label>
                    <input id="nw-waist" type="number" step="0.5" min="40" max="180" placeholder="VD: 78" class="w-full min-h-[48px] px-3.5 rounded-xl bg-slate-100 dark:bg-slate-800">
                </div>
                <button type="submit" class="w-full min-h-[48px] rounded-xl bg-brand-500 text-white text-base font-extrabold">Lưu chỉ số</button>
            </form>
        `);
    }

    function saveWeightEntry(e) {
        e.preventDefault();
        const w = parseFloat(document.getElementById('nw-weight').value);
        const waistVal = document.getElementById('nw-waist').value;
        const waist = waistVal ? parseFloat(waistVal) : null;
        if (!w || w < 25) return;
        appState.profile.weight = w;
        appState.weightHistory.push({ id: uid('w'), date: Date.now(), weight: w, waist });
        closeModal();
        saveStateToStorage();
        renderApp(true);
        showToast(`✅ Đã lưu cân nặng ${w} kg!`);
    }

    function deleteWeightEntry(id) {
        appState.weightHistory = appState.weightHistory.filter(x => x.id !== id);
        saveStateToStorage();
        renderApp(true);
        showToast('Đã xóa mốc cân nặng', 'info');
    }

    function saveProfileForm(e) {
        e.preventDefault();
        appState.profile.gender = document.getElementById('pf-gender').value;
        appState.profile.age = Math.max(12, Math.min(90, Number(document.getElementById('pf-age').value) || 23));
        appState.profile.height = Math.max(120, Math.min(230, Number(document.getElementById('pf-height').value) || 170));
        appState.profile.weight = Math.max(30, Math.min(220, Number(document.getElementById('pf-weight').value) || 66));
        appState.profile.targetWeight = Math.max(30, Math.min(220, Number(document.getElementById('pf-targetw').value) || 68));
        appState.profile.goal = document.getElementById('pf-goal').value;
        appState.profile.dailyBudget = Math.max(25000, Number(document.getElementById('pf-budget').value) || 65000);
        saveStateToStorage(true);
        renderApp(true);
        showToast('✅ Đã lưu hồ sơ & cập nhật mục tiêu Calo!');
    }

    function exportJsonData() {
        const blob = new Blob([JSON.stringify(buildPersistPayload(), null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `nutrigym-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        showToast('📤 Đã tải tệp sao lưu .JSON!');
    }

    function handleImportJson(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                if (!applyPersistPayload(parsed, false)) throw new Error('Invalid');
                saveStateToStorage(true);
                renderApp(true);
                showToast('📥 Đã khôi phục dữ liệu thành công!');
            } catch (err) {
                showToast('Tệp JSON không đúng định dạng NutriGym VN', 'danger');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

            <div class="space-y-4 text-base">

                <div class="space-y-2">
                    <label class="text-sm font-extrabold block">1. Mã dữ liệu máy hiện tại:</label>
                    <textarea id="transfer-export-code" readonly rows="3" class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-mono text-xs break-all">${encoded}</textarea>
                    <button type="button" onclick="copyTransferCode()" class="w-full min-h-[44px] py-2.5 rounded-xl bg-brand-500 text-white text-base font-extrabold active:scale-95 transition">📋 Sao chép mã dữ liệu</button>

                <div class="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-2">

    function copyTransferCode() {
        const area = document.getElementById('transfer-export-code');
        if (!area) return;
        area.select();
        area.setSelectionRange(0, 999999);
        try {
            document.execCommand('copy');
            showToast('📋 Đã sao chép mã dữ liệu!');
        } catch (err) {
            showToast('Hãy chạm giữ vào ô mã rồi chọn Sao chép nhé!', 'info');
        }
    }

    function applyTransferCode() {
        const area = document.getElementById('transfer-import-code');
        const code = (area ? area.value : '').trim();
        if (!code) {
            showToast('Bạn hãy dán mã dữ liệu vào ô trước nhé!', 'warning');
            return;
        }
        try {
            const parsed = JSON.parse(decodeURIComponent(escape(atob(code))));
            if (!applyPersistPayload(parsed, false)) throw new Error('Invalid');
            closeModal();
            saveStateToStorage(true);
            renderApp(false);
            showToast('✅ Đã nhập toàn bộ dữ liệu và tự động lưu thành công!');
        } catch (err) {
            showToast('Mã dữ liệu không hợp lệ hoặc bị thiếu ký tự!', 'danger');
        }
    }

    function executeReset(resetType) {
        if (resetType === 'today_food') {
            const d = appState.weekLogs[appState.selectedDay];
            if (d) {
                d.waterMl = 0;
                d.meals = { breakfast: [], lunch: [], dinner: [], snack: [] };
            }
            showToast(`🍽️ Đã reset ăn uống ngày ${DAY_LABELS[appState.selectedDay]}!`, 'info');
        } else if (resetType === 'week_food') {
            appState.weekLogs = Array.from({ length: 7 }, (_, i) => ({
                dayIndex: i,
                waterMl: 0,
                meals: { breakfast: [], lunch: [], dinner: [], snack: [] }
            }));
            showToast('📅 Đã làm trống toàn bộ 7 ngày ăn uống!', 'info');
        } else if (resetType === 'gym_history') {
            stopRestTimer(false);
            appState.activeWorkout = null;
            appState.workoutHistory = [];
            showToast('🏋️ Đã xóa lịch sử tập & hồi cơ 100%!', 'info');
        } else if (resetType === 'wipe_all') {
            stopRestTimer(false);
            appState = createBlankState(true);
            showToast('✨ Đã xóa trắng dữ liệu — sẵn sàng bắt đầu mới!', 'info');
        } else {
            stopRestTimer(false);
            appState = createDefaultState();
            showToast('🔄 Đã khôi phục dữ liệu mẫu ban đầu!', 'info');
        }

        closeModal();
        renderApp(false);
        saveStateToStorage(true);
    }

    async function triggerNativeInstall() {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();

        deferredInstallPrompt = null;
        closeModal();

    function downloadCleanHtmlFile() {
        try {
            const clone = document.documentElement.cloneNode(true);
            // Xóa các link blob tạm & nội dung runtime để file index.html tải về sạch 100%
            clone.querySelectorAll('[data-runtime-pwa="1"]').forEach(el => el.remove());
            const m = clone.querySelector('#main-content');
            if (m) m.innerHTML = '';
            const mb = clone.querySelector('#modal-backdrop');
            if (mb) mb.classList.add('hidden');
            const mBody = clone.querySelector('#modal-body');
            if (mBody) mBody.innerHTML = '';
            const tc = clone.querySelector('#toast-container');
            if (tc) tc.innerHTML = '';

            const htmlText = '<!DOCTYPE html>\n' + clone.outerHTML;
            const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1500);
            showToast('⬇️ Đã tải tệp index.html sạch về máy!');
        } catch (err) {
            showToast('Không thể tạo tệp tải xuống trên trình duyệt này.', 'danger');
        }
    }

    async function initApp() {
        try {
            setupPwaAssets();
            renderApp(false);
            await loadStateFromStorage();
            renderApp(false);
        } catch (err) {
            console.error('Lỗi khởi chạy NutriGym VN:', err);
            const main = document.getElementById('main-content');
            if (main) {
                main.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 text-rose-700 text-base font-bold">Đã có lỗi khi khởi chạy: ${escapeHtml(err.message || String(err))}</div>`;
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
