    <!-- =======================================================================
         14. ĐỘNG CƠ ĐỒNG BỘ ĐÁM MÂY THỜI GIAN THỰC
    ======================================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db = null;
        let auth = null;
        let currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let unsubscribeSnap = null;

        const CloudSyncEngine = {
            started: false,
            isConnected() {
                return Boolean(db && currentUser);
            },
            async init({ onReady, onRemoteData, onFallbackLocal }) {
                if (this.started) return;
                this.started = true;

                try {
                    if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                        onFallbackLocal?.('Dữ liệu tự động lưu bền vững ngay trên điện thoại của bạn (không mất khi đóng app).');
                        return;
                    }

                    const firebaseConfig = typeof __firebase_config === 'string'
                        ? JSON.parse(__firebase_config)
                        : __firebase_config;

                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    currentUser = auth.currentUser;
                    if (!currentUser) {
                        onFallbackLocal?.('Chưa xác thực được đám mây, đã chuyển sang tự động lưu trên máy.');
                        return;
                    }

                    const stateDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'nutrigymState', 'main');
                    onReady?.(currentUser.uid);

                    if (unsubscribeSnap) unsubscribeSnap();
                    unsubscribeSnap = onSnapshot(
                        stateDocRef,
                        (snap) => {
                            if (!snap.exists()) {
                                onRemoteData?.(null, '');
                                return;
                            }
                            const data = snap.data();
                            if (data && data.payloadJson) {
                                try {
                                    const parsed = JSON.parse(data.payloadJson);
                                    onRemoteData?.(parsed, data.saveId || '');
                                } catch (e) {
                                    console.warn('Lỗi đọc dữ liệu đám mây:', e);
                                }
                            }
                        },
                        (error) => {
                            console.warn('Lỗi lắng nghe đám mây:', error);
                            onFallbackLocal?.('Mất kết nối đám mây tạm thời — dữ liệu vẫn tự động lưu trên máy.');
                        }
                    );
                } catch (err) {
                    console.warn('Chuyển sang tự động lưu trên thiết bị:', err);
                    onFallbackLocal?.('Đang bật chế độ tự động lưu trực tiếp trên thiết bị của bạn.');
                }
            },
            async save(payload, saveId) {
                if (!db || !currentUser) return false;
                try {
                    const stateDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'nutrigymState', 'main');
                    await setDoc(stateDocRef, {
                        payloadJson: JSON.stringify(payload),
                        updatedAt: payload.updatedAt || Date.now(),
                        saveId: saveId || ''
                    });
                    return true;
                } catch (err) {
                    console.warn('Lỗi lưu đám mây:', err);
                    return false;
                }
            }
        };

        window.CloudSyncEngine = CloudSyncEngine;
        if (typeof window.onCloudSyncBridgeReady === 'function') {
            window.onCloudSyncBridgeReady();
        }
    </script>
