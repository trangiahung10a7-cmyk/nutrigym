    <script>
    // =========================================================================
    // 1. CẤU HÌNH PWA CHUẨN IPHONE/ANDROID & TỰ ĐỘNG LƯU BỘ NHỚ MÁY
    // =========================================================================
    let deferredInstallPrompt = null;
    const STORAGE_KEY = 'nutrigym_vn_state_v2';

    /** Tạo biểu tượng PNG bằng Canvas để iPhone Safari & Android Chrome nhận làm icon App */
    function generateAppIconPng(size) {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#10b981');
            grad.addColorStop(1, '#4f46e5');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(size * 0.54, size * 0.16);
            ctx.lineTo(size * 0.25, size * 0.55);
            ctx.lineTo(size * 0.48, size * 0.55);
            ctx.lineTo(size * 0.44, size * 0.84);
            ctx.lineTo(size * 0.75, size * 0.45);
            ctx.lineTo(size * 0.52, size * 0.45);
            ctx.closePath();
            ctx.fill();

            return canvas.toDataURL('image/png');
        } catch (err) {
            return '';
        }
    }

    (function initPWAManifest() {
        try {
            const icon192 = generateAppIconPng(192);
            const icon512 = generateAppIconPng(512);

            if (icon192) {
                const appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.sizes = '192x192';
                appleIcon.href = icon192;
                appleIcon.setAttribute('data-dynamic-pwa', 'true');
                document.head.appendChild(appleIcon);

                const favIcon = document.createElement('link');
                favIcon.rel = 'icon';
                favIcon.type = 'image/png';
                favIcon.href = icon192;
                favIcon.setAttribute('data-dynamic-pwa', 'true');
                document.head.appendChild(favIcon);
            }

            const currentUrl = window.location.href.startsWith('http') ? window.location.href : 'https://nutrigym.local/';
            const manifest = {
                name: 'NutriGym VN - Dinh Dưỡng & Tập Gym',
                short_name: 'NutriGym VN',
                description: 'Ứng dụng tính calo món Việt, ngân sách tuần thông minh và nhật ký tập gym chuẩn khoa học.',
                start_url: currentUrl,
                display: 'standalone',
                background_color: '#0f172a',
                theme_color: '#10b981',
                orientation: 'portrait',
                icons: icon192 && icon512 ? [
                    { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                    { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                ] : []
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(blob);
            manifestLink.setAttribute('data-dynamic-pwa', 'true');
            document.head.appendChild(manifestLink);
        } catch (err) {
            console.warn('Manifest động không khả dụng trong môi trường hiện tại.');
        }
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        showToast('🎉 Đã cài đặt NutriGym VN lên điện thoại thành công!');
    });

    // =========================================================================
    // 2. KHO DỮ LIỆU MÓN ĂN VIỆT NAM, THỰC ĐƠN MẪU & BÀI TẬP GYM

                routines: appState.routines,

            if (saved.profile) appState.profile = { ...appState.profile, ...saved.profile };
            if (Array.isArray(saved.customFoods)) appState.customFoods = saved.customFoods;

            if (Array.isArray(saved.weightHistory)) appState.weightHistory = saved.weightHistory;
            if (saved.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-color-meta').content = '#0f172a';
            }
        } catch (err) {
            console.warn('Khởi tạo dữ liệu mặc định:', err);

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    function normalizeVN(str) {
        return String(str || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .trim();
    }

    function formatDuration(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        const pad = n => String(n).padStart(2, '0');
        return h > 0 ? `${pad(h)}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }

    /** Phát tiếng chuông bíp ngắn khi hết giờ nghỉ bằng Web Audio API */
    function playRestDoneSound() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            [0, 0.22, 0.44].forEach((offset, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = idx === 2 ? 1046 : 880;
                gain.gain.setValueAtTime(0.18, ctx.currentTime + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + offset);
                osc.stop(ctx.currentTime + offset + 0.19);
            });
        } catch (err) {
            // Bỏ qua nếu thiết bị tắt âm thanh
        }
    }

    // =========================================================================
    // 5. CÔNG THỨC KHOA HỌC: BMR, TDEE, MACRO & NGÂN SÁCH TUẦN (NUTREE)
    // =========================================================================
    function getAllFoods() {
        return [...appState.customFoods, ...VIETNAM_FOODS];

    function calculateMetrics() {
        const p = appState.profile;
        const w = Number(p.weight) || 70;
        const h = Number(p.height) || 170;
        const a = Number(p.age) || 25;

        // Mifflin-St Jeor
        const bmr = Math.round(10 * w + 6.25 * h - 5 * a + (p.gender === 'male' ? 5 : -161));
        const tdee = Math.round(bmr * (Number(p.activity) || 1.55));
        const bmi = Number((w / Math.pow(h / 100, 2)).toFixed(1));

        let bmiText = 'Bình thường';
        if (bmi < 18.5) bmiText = 'Thiếu cân';
        else if (bmi >= 25 && bmi < 30) bmiText = 'Thừa cân';
        else if (bmi >= 30) bmiText = 'Béo phì';

        let baseTargetCal = tdee;
        let proteinPerKg = 1.8;
        let fatRatio = 0.25;

        if (p.goal === 'cut') {
            baseTargetCal = Math.max(1200, tdee - 400);
            proteinPerKg = 2.0;
            fatRatio = 0.25;
        } else if (p.goal === 'bulk') {
            baseTargetCal = tdee + 300;
            proteinPerKg = 1.9;
            fatRatio = 0.25;
        }

        const targetP = Math.round(w * proteinPerKg);
        const targetF = Math.round((baseTargetCal * fatRatio) / 9);
        const targetC = Math.max(50, Math.round((baseTargetCal - targetP * 4 - targetF * 9) / 4));

        return { bmr, tdee, bmi, bmiText, baseTargetCal, targetP, targetC, targetF };
    }

    function getDayTotals(dayLog) {
        let cal = 0, p = 0, c = 0, f = 0;
        ['breakfast', 'lunch', 'dinner', 'snack'].forEach(mealKey => {
            (dayLog.meals[mealKey] || []).forEach(item => {
                cal += Number(item.cal) || 0;
                p += Number(item.p) || 0;
                c += Number(item.c) || 0;
                f += Number(item.f) || 0;
            });
        });
        return {
            cal: Math.round(cal),
            p: Math.round(p),
            c: Math.round(c),
            f: Math.round(f)
        };
    }

    /** Tính mục tiêu Calo ngày hôm đang chọn (có tính bù trừ Ngân sách tuần) */
    function getAdaptiveDayTarget(dayIndex) {
        const metrics = calculateMetrics();
        if (!appState.profile.weeklyBalance) {
            return { targetCal: metrics.baseTargetCal, diffFromBase: 0, weeklyRemaining: 0 };
        }

        const weeklyBudget = metrics.baseTargetCal * 7;
        // Cộng tổng các ngày trước dayIndex đã có ghi chép bữa ăn
        let pastDiff = 0;
        for (let i = 0; i < dayIndex; i++) {
            const totals = getDayTotals(appState.weekLogs[i]);
            if (totals.cal > 0) {
                pastDiff += (totals.cal - metrics.baseTargetCal);
            }
        }
        const remainingDays = Math.max(1, 7 - dayIndex);
        const adjustment = Math.round(-pastDiff / remainingDays);
        const adjustedTarget = Math.max(1200, metrics.baseTargetCal + adjustment);

        const totalConsumedWeek = appState.weekLogs.reduce((sum, d) => sum + getDayTotals(d).cal, 0);
        return {
            targetCal: adjustedTarget,
            diffFromBase: adjustedTarget - metrics.baseTargetCal,
            weeklyRemaining: weeklyBudget - totalConsumedWeek
        };
    }

    // =========================================================================
    // 6. TÍNH TOÁN PHỤC HỒI CƠ BẮP (OPENGYM MUSCLE RECOVERY ENGINE)
    // =========================================================================
    function getMuscleRecoveryMap() {
        const now = Date.now();
        const result = {};

        Object.keys(MUSCLE_INFO).forEach(mKey => {
            let lastTime = 0;
            let weeklySets = 0;
            let fatigueLoad = 0;

            appState.workoutHistory.forEach(w => {
                const sets = (w.musclesWorked && w.musclesWorked[mKey]) ? w.musclesWorked[mKey] : 0;
                if (sets > 0) {
                    const hoursAgo = (now - w.date) / (3600 * 1000);
                    if (hoursAgo <= 168) weeklySets += sets;
                    if (w.date > lastTime) lastTime = w.date;
                    // Mô hình hồi phục sinh học: 48–60 giờ phục hồi hoàn toàn tùy khối lượng tập
                    const recoveryWindow = Math.min(72, 36 + sets * 3);
                    if (hoursAgo < recoveryWindow) {
                        const remainRatio = 1 - (hoursAgo / recoveryWindow);
                        fatigueLoad = Math.min(1, fatigueLoad + remainRatio * 0.9);
                    }
                }
            });

            const recoveryPct = Math.round(Math.max(5, Math.min(100, (1 - fatigueLoad) * 100)));
            let status = 'ready';
            let label = 'Sẵn sàng tập';
            let color = '#10b981';

            if (recoveryPct < 45) {
                status = 'fatigued';
                label = 'Đang mỏi';
                color = '#ef4444';
            } else if (recoveryPct < 82) {
                status = 'recovering';
                label = 'Đang phục hồi';
                color = '#f59e0b';
            }

            result[mKey] = {
                recoveryPct,
                status,
                label,
                color,
                weeklySets,
                lastHoursAgo: lastTime ? Math.round((now - lastTime) / (3600 * 1000)) : null
            };
        });

        return result;
    }

    function addWater(delta) {
        const dayLog = appState.weekLogs[appState.selectedDay];
        dayLog.waterMl = Math.max(0, dayLog.waterMl + delta);
        renderApp();
        if (delta > 0 && dayLog.waterMl >= appState.profile.waterGoal) {
            showToast('💧 Tuyệt vời! Bạn đã uống đủ nước mục tiêu hôm nay!');
        }
    }

    function addFoodToMeal(mealKey, foodObj, qty = 1) {
        const q = Math.max(0.25, Number(qty) || 1);
        const entry = {
            id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            foodId: foodObj.id,
            name: foodObj.name,
            unit: foodObj.unit,
            qty: q,
            cal: Math.round(foodObj.cal * q),
            p: Number((foodObj.p * q).toFixed(1)),
            c: Number((foodObj.c * q).toFixed(1)),
            f: Number((foodObj.f * q).toFixed(1))
        };
        appState.weekLogs[appState.selectedDay].meals[mealKey].push(entry);
        renderApp();
    }

    function removeMealItem(mealKey, itemId) {
        const list = appState.weekLogs[appState.selectedDay].meals[mealKey];
        appState.weekLogs[appState.selectedDay].meals[mealKey] = list.filter(it => it.id !== itemId);
        renderApp();
        showToast('Đã xóa món khỏi nhật ký', 'info');
    }

    /** Phân tích câu tiếng Việt tự nhiên như "1 phở bò, 2 trứng luộc, 1.5 cơm trắng" */
    function handleQuickAddText(e) {
        e.preventDefault();
        const input = document.getElementById('quick-food-input');
        const mealKey = document.getElementById('quick-meal-select').value;
        const raw = (input ? input.value : '').trim();
        if (!raw) return;

        const parts = raw.split(/[,;+\n]+/).map(s => s.trim()).filter(Boolean);
        const allFoods = getAllFoods();
        let addedCount = 0;

        parts.forEach(part => {
            const qtyMatch = part.match(/^(\d+(?:[.,]\d+)?)\s*/);
            const qty = qtyMatch ? parseFloat(qtyMatch[1].replace(',', '.')) : 1;
            const query = normalizeVN(part.replace(/^(\d+(?:[.,]\d+)?)\s*(to|bat|chen|qua|ly|o|dia|suat|hop|muong|cu|mieng)?\s*/i, ''));

            if (!query) return;
            const matched = allFoods.find(food => {
                const nameNorm = normalizeVN(food.name);
                if (nameNorm.includes(query) || query.includes(nameNorm)) return true;
                return (food.kw || []).some(k => query.includes(k) || k.includes(query));
            });

            if (matched) {
                addFoodToMeal(mealKey, matched, qty);
                addedCount++;
            }
        });

        if (addedCount > 0) {
            showToast(`⚡ Đã nhận diện và thêm ${addedCount} món ăn!`);
        } else {
            showToast('Chưa khớp món trong kho, bạn thử tìm ở mục "+ Thêm món ăn" nhé!', 'warning');
        }
    }

    function filterFoodList(mealKey) {
        const q = normalizeVN(document.getElementById('food-search-input')?.value || '');
        const listEl = document.getElementById('food-picker-list');
        if (!listEl) return;

        const filtered = getAllFoods().filter(f => {
            if (!q) return true;
            return normalizeVN(f.name).includes(q) || normalizeVN(f.cat).includes(q) || (f.kw || []).some(k => k.includes(q));
        });

        if (filtered.length === 0) {
            listEl.innerHTML = `<p class="text-base text-center text-slate-400 py-6">Không tìm thấy món phù hợp. Hãy bấm <b>"+ Tự tạo"</b> để thêm món riêng của bạn!</p>`;
            return;

        listEl.innerHTML = filtered.map(f => `
            <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">

                    <p class="text-sm text-slate-500 dark:text-slate-400">${escapeHtml(f.unit)} • <b>${f.cal} kcal</b> (P ${f.p}g / C ${f.c}g / F ${f.f}g)</p>

                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="pickFoodItem('${mealKey}', '${f.id}', 0.5)" class="min-w-[44px] min-h-[44px] px-3 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-base font-bold">½</button>

        `).join('');
    }

    function applyMealPlan(planId) {
        const plan = MEAL_PLANS.find(p => p.id === planId);
        if (!plan) return;
        const allFoods = getAllFoods();
        const dayLog = appState.weekLogs[appState.selectedDay];

        ['breakfast', 'lunch', 'dinner', 'snack'].forEach(mealKey => {
            dayLog.meals[mealKey] = [];
            (plan.meals[mealKey] || []).forEach(entry => {
                const f = allFoods.find(x => x.id === entry.foodId);
                if (f) {
                    dayLog.meals[mealKey].push({
                        id: 'mp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        foodId: f.id,
                        name: f.name,
                        unit: f.unit,
                        qty: entry.qty,
                        cal: Math.round(f.cal * entry.qty),
                        p: Number((f.p * entry.qty).toFixed(1)),
                        c: Number((f.c * entry.qty).toFixed(1)),
                        f: Number((f.f * entry.qty).toFixed(1))
                    });
                }
            });
        });

        closeModal();
        renderApp();
        showToast('🥗 Đã áp dụng thực đơn vào ngày hôm nay!');
    }

                                <button onclick="startRestTimer(${sec})" class="min-w-[48px] min-h-[44px] px-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-bold">${sec}s</button>
                            `).join('')}
                            ${restTimerState.running ? `
                                <button onclick="adjustRestTimer(15)" class="min-h-[44px] px-3 rounded-xl bg-amber-500/20 text-amber-300 text-sm font-bold">+15s</button>
                                <button onclick="stopRestTimer()" class="ml-auto min-h-[44px] px-3.5 rounded-xl bg-rose-500/20 text-rose-300 text-sm font-bold">Dừng</button>
                            ` : ''}
                        </div>
                    </div>
                </section>

                <!-- Danh sách bài tập trong buổi -->
                <div class="space-y-3">
                    ${wk.exercises.map((ex, exIdx) => {
                        let best1RM = 0;
                        ex.sets.forEach(s => {
                            const w = Number(s.weight) || 0;
                            const r = Number(s.reps) || 0;
                            if (w > 0 && r > 0) {
                                const est = Math.round(w * (1 + r / 30));
                                if (est > best1RM) best1RM = est;
                            }
                        });

                        const typeStyles = {
                            N: 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300',
                            W: 'bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300',
                            D: 'bg-purple-100 dark:bg-purple-500/20 text-purple-700 dark:text-purple-300',
                            F: 'bg-rose-100 dark:bg-rose-500/20 text-rose-700 dark:text-rose-300'
                        };

                        return `
                            <section class="bg-white dark:bg-slate-900 rounded-3xl p-3.5 sm:p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
                                <div class="flex items-start justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <h3 class="text-base font-extrabold text-gym-700 dark:text-gym-400 break-words">${escapeHtml(ex.name)}</h3>
                                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                                            Ước tính 1RM: <b>${best1RM > 0 ? best1RM + ' kg' : '--'}</b> • Nghỉ ${ex.defaultRest}s
                                        </p>
                                    </div>
                                    <button onclick="removeWorkoutExercise(${exIdx})" aria-label="Xóa bài tập" class="min-w-[44px] min-h-[44px] rounded-xl text-base font-bold text-slate-400 hover:text-rose-500 flex items-center justify-center shrink-0">✕</button>
                                </div>

                                <!-- Header bảng hiệp (tối ưu chiều rộng chống tràn ngang) -->
                                <div class="grid grid-cols-[44px_minmax(0,1fr)_minmax(0,1fr)_52px_44px] gap-1.5 text-xs font-bold text-slate-400 uppercase px-1">
                                    <div class="text-center">Loại</div>
                                    <div class="text-center">Tạ (kg)</div>
                                    <div class="text-center">Reps</div>
                                    <div class="text-center">RPE</div>
                                    <div class="text-center">Xong</div>
                                </div>

                                <div class="space-y-2">
                                    ${ex.sets.map((s, sIdx) => `
                                        <div class="grid grid-cols-[44px_minmax(0,1fr)_minmax(0,1fr)_52px_44px] gap-1.5 items-center p-1 rounded-2xl transition ${s.done ? 'bg-brand-50/90 dark:bg-brand-500/15' : ''}">
                                            <button onclick="cycleSetType(${exIdx}, ${sIdx})" title="Nhấn để đổi: Chính (N) / Khởi động (W) / Drop (D) / Failure (F)" class="w-[44px] min-h-[44px] rounded-xl text-sm font-black ${typeStyles[s.type] || typeStyles.N}">
                                                ${s.type === 'N' ? (sIdx + 1) : s.type}
                                            </button>
                                            <input type="number" step="0.5" value="${s.weight}" onchange="updateSetField(${exIdx}, ${sIdx}, 'weight', this.value)" class="w-full min-w-0 min-h-[44px] px-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-center text-base font-extrabold focus:outline-none focus:ring-2 focus:ring-gym-500"/>
                                            <input type="number" value="${s.reps}" onchange="updateSetField(${exIdx}, ${sIdx}, 'reps', this.value)" class="w-full min-w-0 min-h-[44px] px-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-center text-base font-extrabold focus:outline-none focus:ring-2 focus:ring-gym-500"/>
                                            <select onchange="updateSetField(${exIdx}, ${sIdx}, 'rpe', this.value)" class="w-full min-w-0 min-h-[44px] px-0.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-center text-base font-bold">
                                                ${[6, 7, 8, 9, 10].map(v => `<option value="${v}" ${Number(s.rpe) === v ? 'selected' : ''}>${v}</option>`).join('')}
                                            </select>
                                            <button onclick="toggleSetDone(${exIdx}, ${sIdx})" aria-label="Đánh dấu hoàn thành hiệp" class="w-[44px] min-h-[44px] rounded-xl font-black text-base active:scale-95 transition ${
                                                s.done
                                                    ? 'bg-brand-500 text-white shadow-sm'
                                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-400'
                                            }">✓</button>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="flex gap-2 pt-1">
                                    <button onclick="addWorkoutSet(${exIdx})" class="flex-1 min-h-[44px] py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-base font-bold">+ Thêm hiệp</button>
                                    ${ex.sets.length > 1 ? `<button onclick="removeLastSet(${exIdx})" class="min-h-[44px] px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-rose-500 text-base font-bold shrink-0">- Bớt</button>` : ''}
                                </div>
                            </section>
                        `;
                    }).join('')}
                </div>

                <!-- Nút thêm bài tập & Hủy buổi tập -->
                <div class="flex flex-col sm:flex-row gap-2.5 pt-1">
                    <button onclick="openAddExerciseToWorkoutModal()" class="flex-1 min-h-[48px] py-3 rounded-2xl bg-gym-50 dark:bg-gym-500/15 text-gym-700 dark:text-gym-300 border border-gym-200 dark:border-gym-500/30 text-base font-extrabold active:scale-95 transition">
                        + Thêm bài tập
                    </button>
                    <button onclick="confirmCancelWorkout()" class="min-h-[48px] px-5 py-3 rounded-2xl bg-rose-50 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400 text-base font-extrabold active:scale-95 transition">
                        Hủy buổi
                    </button>
                </div>
            </div>
        `;
    }

    function ensureWorkoutTicker() {
        if (workoutTickInterval) clearInterval(workoutTickInterval);
        workoutTickInterval = setInterval(() => {
            if (!appState.activeWorkout) {
                clearInterval(workoutTickInterval);
                workoutTickInterval = null;
                return;
            }
            const elapsed = Math.floor((Date.now() - appState.activeWorkout.startTime) / 1000);
            const clockEl = document.getElementById('active-workout-clock');
            if (clockEl) clockEl.textContent = formatDuration(elapsed);
            const bannerTimer = document.getElementById('banner-workout-timer');
            if (bannerTimer) bannerTimer.textContent = `⏱ ${formatDuration(elapsed)}`;
        }, 1000);
    }

    function startRoutineWorkout(routineId) {
        const rt = appState.routines.find(r => r.id === routineId);
        if (!rt) return;

        appState.activeWorkout = {
            name: rt.name,
            startTime: Date.now(),
            exercises: rt.exercises.map(item => {
                const db = EXERCISE_DB.find(e => e.id === item.exId) || EXERCISE_DB[0];
                return {
                    exId: db.id,
                    name: db.name,
                    muscles: db.muscles,
                    defaultRest: db.defaultRest || 90,
                    sets: Array.from({ length: item.sets || 3 }, () => ({
                        type: 'N',
                        weight: item.weight || 20,
                        reps: item.reps || 10,
                        rpe: 8,
                        done: false
                    }))
                };
            })
        };
        ensureWorkoutTicker();
        renderApp();
        showToast('🔥 Bắt đầu buổi tập! Chúc bạn tập thật sung!');
    }

    function startEmptyWorkout() {
        appState.activeWorkout = {
            name: 'Buổi tập tự do',
            startTime: Date.now(),
            exercises: []
        };
        ensureWorkoutTicker();
        renderApp();
        openAddExerciseToWorkoutModal();
    }

    function cycleSetType(exIdx, sIdx) {
        const order = ['N', 'W', 'D', 'F'];
        const setObj = appState.activeWorkout.exercises[exIdx].sets[sIdx];
        setObj.type = order[(order.indexOf(setObj.type) + 1) % order.length];
        renderApp();
    }

    function updateSetField(exIdx, sIdx, field, value) {
        appState.activeWorkout.exercises[exIdx].sets[sIdx][field] = Number(value) || 0;
        renderApp();
    }

    function toggleSetDone(exIdx, sIdx) {
        const ex = appState.activeWorkout.exercises[exIdx];
        const setObj = ex.sets[sIdx];
        setObj.done = !setObj.done;
        if (setObj.done) {
            startRestTimer(ex.defaultRest || 90);
        }
        renderApp();
    }

    function addWorkoutSet(exIdx) {
        const ex = appState.activeWorkout.exercises[exIdx];
        const last = ex.sets[ex.sets.length - 1] || { weight: 20, reps: 10, rpe: 8 };
        ex.sets.push({ type: 'N', weight: last.weight, reps: last.reps, rpe: last.rpe, done: false });
        renderApp();
    }

    function removeLastSet(exIdx) {
        const ex = appState.activeWorkout.exercises[exIdx];
        if (ex.sets.length > 1) ex.sets.pop();
        renderApp();
    }

    function removeWorkoutExercise(exIdx) {
        appState.activeWorkout.exercises.splice(exIdx, 1);
        renderApp();
    }

    function openAddExerciseToWorkoutModal() {
        openModal('➕ Chọn bài tập thêm vào buổi', `
            <div class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1">
                ${EXERCISE_DB.map(ex => `
                    <button onclick="addExerciseToActiveWorkout('${ex.id}')" class="w-full min-h-[56px] text-left p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800 hover:bg-gym-50 dark:hover:bg-gym-500/15 border border-slate-200/70 dark:border-slate-700 flex items-center justify-between gap-2.5 transition">
                        <div class="min-w-0 flex-1">
                            <p class="text-base font-extrabold break-words">${escapeHtml(ex.name)}</p>
                            <p class="text-sm text-slate-500 dark:text-slate-400">${ex.muscles.map(m => MUSCLE_INFO[m]?.name.split(' (')[0]).join(' • ')}</p>
                        </div>
                        <span class="text-base font-black text-gym-600 dark:text-gym-400 shrink-0">+ Thêm</span>
                    </button>
                `).join('')}
            </div>
        `);
    }

    function addExerciseToActiveWorkout(exId) {
        const db = EXERCISE_DB.find(e => e.id === exId);
        if (!db || !appState.activeWorkout) return;
        appState.activeWorkout.exercises.push({
            exId: db.id,
            name: db.name,
            muscles: db.muscles,
            defaultRest: db.defaultRest || 90,
            sets: [
                { type: 'N', weight: 20, reps: 10, rpe: 8, done: false },
                { type: 'N', weight: 20, reps: 10, rpe: 8, done: false },
                { type: 'N', weight: 20, reps: 10, rpe: 8, done: false }
            ]
        });
        closeModal();
        renderApp();
        showToast(`Đã thêm ${db.name.split(' (')[0]}`);
    }

    function startRestTimer(seconds) {
        stopRestTimer(false);
        restTimerState.total = seconds;
        restTimerState.remaining = seconds;
        restTimerState.running = true;

        restTimerState.intervalId = setInterval(() => {
            restTimerState.remaining--;
            const clockEl = document.getElementById('rest-clock-display');
            const barEl = document.getElementById('rest-progress-bar');

            if (restTimerState.remaining <= 0) {
                stopRestTimer(false);
                playRestDoneSound();
                showToast('🔔 Hết giờ nghỉ! Vào hiệp tiếp theo thôi nào!', 'info');
                if (appState.activeTab === 'gym') renderApp();
                return;
            }
            if (clockEl) clockEl.textContent = formatDuration(restTimerState.remaining);
            if (barEl) barEl.style.width = `${Math.round((restTimerState.remaining / restTimerState.total) * 100)}%`;
        }, 1000);

        if (appState.activeTab === 'gym') renderApp();
    }

    function adjustRestTimer(delta) {
        restTimerState.remaining = Math.max(5, restTimerState.remaining + delta);
        restTimerState.total = Math.max(restTimerState.total, restTimerState.remaining);
        renderApp();
    }

    function stopRestTimer(rerender = true) {
        if (restTimerState.intervalId) clearInterval(restTimerState.intervalId);
        restTimerState.intervalId = null;
        restTimerState.running = false;
        restTimerState.remaining = 0;
        if (rerender && appState.activeTab === 'gym') renderApp();
    }

    function confirmCancelWorkout() {
        openModal('⚠️ Hủy buổi tập hiện tại?', `
            <div class="space-y-4 text-base">
                <p class="text-slate-600 dark:text-slate-300">Các hiệp bạn đang ghi chép trong buổi tập này sẽ không được lưu vào lịch sử. Bạn chắc chắn muốn hủy chứ?</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button onclick="closeModal()" class="min-h-[48px] py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold">Tiếp tục tập</button>
                    <button onclick="cancelWorkoutNow()" class="min-h-[48px] py-2.5 rounded-xl bg-rose-600 text-white text-base font-extrabold">Xác nhận hủy</button>
                </div>
            </div>
        `);
    }

    function cancelWorkoutNow() {
        stopRestTimer(false);
        appState.activeWorkout = null;
        closeModal();
        renderApp();
        showToast('Đã hủy buổi tập', 'info');
    }

    function finishWorkout() {
        const wk = appState.activeWorkout;
        if (!wk) return;

        let totalVolume = 0;
        let totalSets = 0;
        const musclesWorked = {};
        const exSummary = [];

        wk.exercises.forEach(ex => {
            const doneList = ex.sets.filter(s => s.done);
            if (doneList.length === 0) return;

            let best1RM = 0;
            doneList.forEach(s => {
                totalSets++;
                const w = Number(s.weight) || 0;
                const r = Number(s.reps) || 0;
                totalVolume += w * r;
                const est = Math.round(w * (1 + r / 30));
                if (est > best1RM) best1RM = est;
            });

            (ex.muscles || []).forEach(m => {
                musclesWorked[m] = (musclesWorked[m] || 0) + doneList.length;
            });

            exSummary.push({ name: ex.name, setsCount: doneList.length, best1RM });
        });

        if (totalSets === 0) {
            showToast('Hãy đánh dấu ✓ ít nhất 1 hiệp hoàn thành trước khi lưu buổi tập nhé!', 'warning');
            return;
        }

        const durationSec = Math.max(60, Math.floor((Date.now() - wk.startTime) / 1000));
        const record = {
            id: 'wh_' + Date.now(),
            name: wk.name,
            date: Date.now(),
            durationSec,
            totalVolume: Math.round(totalVolume),
            totalSets,
            musclesWorked,
            exercises: exSummary
        };

        appState.workoutHistory.unshift(record);
        appState.activeWorkout = null;
        stopRestTimer(false);
        renderApp();

        openModal('🏆 Hoàn thành buổi tập xuất sắc!', `
            <div class="space-y-4 text-center text-base">
                <div class="text-4xl">💪🔥</div>
                <p class="text-lg font-extrabold break-words">${escapeHtml(record.name)}</p>
                <div class="grid grid-cols-3 gap-2 bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 font-bold">Thời lượng</p>
                        <p class="text-base font-black">${formatDuration(record.durationSec)}</p>
                    </div>
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 font-bold">Tổng tạ</p>
                        <p class="text-base font-black text-brand-600 dark:text-brand-400">${record.totalVolume.toLocaleString('vi-VN')} kg</p>
                    </div>
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 font-bold">Số hiệp</p>
                        <p class="text-base font-black">${record.totalSets}</p>
                    </div>
                </div>
                <p class="text-base text-slate-500 dark:text-slate-400">Bản đồ trạng thái mỏi & phục hồi cơ bắp đã được tự động cập nhật!</p>
                <button onclick="closeModal(); switchTab('muscles');" class="w-full min-h-[48px] py-3 rounded-2xl bg-brand-500 text-white text-base font-extrabold">Xem Bản đồ Cơ bắp →</button>
            </div>
        `);
    }

    function openCreateRoutineModal() {
        openModal('📋 Tạo giáo án tập riêng', `
            <form onsubmit="saveNewRoutine(event)" class="space-y-3.5 text-base">
                <div>
                    <label class="font-bold block mb-1">Tên giáo án</label>
                    <input id="rt-name" required placeholder="VD: Upper Body — Thân trên" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-semibold"/>
                </div>
                <div>
                    <label class="font-bold block mb-1">Phân loại</label>
                    <input id="rt-tag" value="Tự thiết kế" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-semibold"/>
                </div>
                <div>
                    <label class="font-bold block mb-2">Chọn các bài tập (ít nhất 1 bài)</label>
                    <div class="max-h-56 overflow-y-auto space-y-2 pr-1">
                        ${EXERCISE_DB.map(ex => `
                            <label class="min-h-[44px] flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 cursor-pointer">
                                <input type="checkbox" name="rt-ex" value="${ex.id}" class="w-5 h-5 rounded text-gym-600 shrink-0"/>
                                <span class="text-base font-semibold break-words">${escapeHtml(ex.name)}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <button type="submit" class="w-full min-h-[48px] py-3 rounded-2xl bg-gym-600 hover:bg-gym-500 text-white text-base font-extrabold">Lưu giáo án</button>
            </form>
        `);
    }

    function saveNewRoutine(e) {
        e.preventDefault();
        const checked = Array.from(document.querySelectorAll('input[name="rt-ex"]:checked')).map(el => el.value);
        if (checked.length === 0) {
            showToast('Bạn hãy tick chọn ít nhất 1 bài tập nhé!', 'warning');
            return;
        }
        const rt = {
            id: 'custom_' + Date.now(),
            name: document.getElementById('rt-name').value.trim(),
            tag: document.getElementById('rt-tag').value.trim() || 'Tự tạo',
            exercises: checked.map(exId => ({ exId, sets: 3, reps: 10, weight: 20 }))
        };
        appState.routines.unshift(rt);
        closeModal();
        renderApp();
        showToast(`📋 Đã tạo giáo án "${rt.name}"!`);
    }

    function deleteRoutine(rtId) {
        appState.routines = appState.routines.filter(r => r.id !== rtId);
        renderApp();
        showToast('Đã xóa giáo án', 'info');
    }

    // =========================================================================
    // 10. TAB 3: BẢN ĐỒ PHỤC HỒI CƠ BẮP TƯƠNG TÁC (SVG)
    // =========================================================================

                        <div class="min-w-0 flex-1">

    // =========================================================================
    // 11. TAB 4: TIẾN ĐỘ CÂN NẶNG & LỊCH SỬ TẬP LUYỆN
    // =========================================================================
    function renderProgressTab() {
        const list = appState.weightHistory;
        const latest = list[list.length - 1] || { weight: appState.profile.weight, waist: 80, fat: 18 };
        const first = list[0] || latest;
        const diffW = Number((latest.weight - first.weight).toFixed(1));

        // Vẽ biểu đồ SVG đường cân nặng đáp ứng không tràn khung
        const weights = list.map(x => x.weight);
        const minW = Math.min(...weights) - 1;
        const maxW = Math.max(...weights) + 1;
        const range = Math.max(1, maxW - minW);

        const points = list.map((item, idx) => {
            const x = list.length === 1 ? 160 : 34 + (idx / (list.length - 1)) * 252;
            const y = 100 - ((item.weight - minW) / range) * 68;
            return { x, y, ...item };
        });
        const polyline = points.map(p => `${p.x},${p.y}`).join(' ');

        return `
            <div class="space-y-4 animate-fade-up">
                <!-- Biểu đồ cân nặng -->
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3.5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                        <div class="min-w-0">
                            <h2 class="text-lg font-extrabold">Biểu đồ Cân nặng & Số đo</h2>
                            <p class="text-sm text-slate-500 dark:text-slate-400">
                                Hiện tại: <b>${latest.weight} kg</b> (${diffW > 0 ? '+' : ''}${diffW} kg so với ban đầu)
                            </p>
                        </div>
                        <button onclick="openAddWeightModal()" class="w-full sm:w-auto min-h-[44px] px-4 py-2 rounded-xl bg-brand-500 text-white text-base font-extrabold shrink-0 active:scale-95 transition">
                            + Ghi chỉ số
                        </button>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-3 overflow-hidden">
                        <svg viewBox="0 0 320 135" preserveAspectRatio="xMidYMid meet" class="w-full max-w-full h-auto block overflow-hidden">
                            <line x1="20" y1="30" x2="300" y2="30" stroke="currentColor" stroke-dasharray="3 3" class="text-slate-200 dark:text-slate-700"/>
                            <line x1="20" y1="65" x2="300" y2="65" stroke="currentColor" stroke-dasharray="3 3" class="text-slate-200 dark:text-slate-700"/>
                            <line x1="20" y1="100" x2="300" y2="100" stroke="currentColor" stroke-dasharray="3 3" class="text-slate-200 dark:text-slate-700"/>
                            ${points.length > 1 ? `<polyline fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polyline}"/>` : ''}
                            ${points.map(p => `
                                <circle cx="${p.x}" cy="${p.y}" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
                                <text x="${p.x}" y="${p.y - 11}" text-anchor="middle" class="fill-slate-700 dark:fill-slate-200 text-[11px] font-bold">${p.weight}</text>
                                <text x="${p.x}" y="124" text-anchor="middle" class="fill-slate-500 dark:fill-slate-400 text-[10px] font-semibold">${p.date}</text>
                            `).join('')}
                        </svg>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 min-w-0">
                            <p class="text-xs font-bold text-slate-400">Cân nặng</p>
                            <p class="text-base font-black mt-0.5">${latest.weight} kg</p>
                        </div>
                        <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 min-w-0">
                            <p class="text-xs font-bold text-slate-400">Vòng eo</p>
                            <p class="text-base font-black mt-0.5">${latest.waist || '--'} cm</p>
                        </div>
                        <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 min-w-0">
                            <p class="text-xs font-bold text-slate-400">% Mỡ</p>
                            <p class="text-base font-black mt-0.5">${latest.fat || '--'}%</p>
                        </div>
                    </div>
                </section>

                <!-- Lịch sử các buổi tập Gym -->
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-base font-extrabold">Lịch sử buổi tập (${appState.workoutHistory.length})</h3>
                </div>

                ${appState.workoutHistory.length === 0 ? `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 text-center border border-slate-200 dark:border-slate-800">
                        <p class="text-base text-slate-400">Bạn chưa lưu buổi tập nào. Hãy sang mục <b>Tập Gym</b> để bắt đầu nhé!</p>
                    </div>
                ` : `
                    <div class="space-y-3">
                        ${appState.workoutHistory.map(w => {
                            const d = new Date(w.date);
                            const dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} • ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                            return `
                                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-2.5">
                                    <div class="flex items-start justify-between gap-2">
                                        <div class="min-w-0 flex-1">
                                            <h4 class="text-base font-extrabold break-words">${escapeHtml(w.name)}</h4>
                                            <p class="text-sm text-slate-400 font-semibold">${dateStr}</p>

                                    </div>
                                    <div class="flex flex-wrap gap-3 text-sm font-bold text-slate-500 dark:text-slate-400">
                                        <span>⏱ ${formatDuration(w.durationSec)}</span>
                                        <span>• ${w.totalSets} hiệp hoàn thành</span>
                                    </div>
                                    <div class="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-1.5">
                                        ${(w.exercises || []).map(e => `
                                            <div class="flex justify-between gap-2 text-sm">
                                                <span class="text-slate-600 dark:text-slate-300 truncate">${e.setsCount}× ${escapeHtml(e.name.split(' (')[0])}</span>
                                                <span class="font-bold text-slate-500 shrink-0">1RM ~${e.best1RM}kg</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            `;
                        }).join('')}
                    </div>
                `}
            </div>
        `;
    }

    function openAddWeightModal() {
        const latest = appState.weightHistory[appState.weightHistory.length - 1] || { weight: appState.profile.weight, waist: 80, fat: 18 };
        openModal('⚖️ Cập nhật Cân nặng & Số đo', `
            <form onsubmit="saveWeightEntry(event)" class="space-y-4 text-base">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="font-bold block mb-1">Cân nặng (kg)</label>
                        <input id="wh-weight" type="number" step="0.1" required value="${latest.weight}" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold"/>
                    </div>
                    <div>
                        <label class="font-bold block mb-1">Vòng eo (cm)</label>
                        <input id="wh-waist" type="number" step="0.1" value="${latest.waist || 80}" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold"/>
                    </div>
                    <div>
                        <label class="font-bold block mb-1">% Mỡ cơ thể</label>
                        <input id="wh-fat" type="number" step="0.1" value="${latest.fat || 18}" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold"/>
                    </div>
                </div>
                <button type="submit" class="w-full min-h-[48px] py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-base font-extrabold">Lưu chỉ số hôm nay</button>
            </form>
        `);
    }

    function saveWeightEntry(e) {
        e.preventDefault();
        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
        const weight = Number(document.getElementById('wh-weight').value) || appState.profile.weight;
        const waist = Number(document.getElementById('wh-waist').value) || 0;
        const fat = Number(document.getElementById('wh-fat').value) || 0;

        appState.weightHistory.push({ date: dateStr, weight, waist, fat });
        if (appState.weightHistory.length > 14) appState.weightHistory.shift();
        appState.profile.weight = weight;

        closeModal();
        renderApp();
        showToast('⚖️ Đã cập nhật cân nặng & tự tính lại TDEE!');
    }

                                <input id="pf-weight" type="number" step="0.1" value="${p.weight}" class="w-full min-h-[44px] px-2.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold"/>
                            </div>
                        </div>

                        <div>
                            <label class="font-bold block mb-1">Mức độ vận động</label>
                            <select id="pf-activity" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-semibold">
                                <option value="1.2" ${p.activity == 1.2 ? 'selected' : ''}>Ít vận động (Ngồi văn phòng)</option>
                                <option value="1.375" ${p.activity == 1.375 ? 'selected' : ''}>Nhẹ nhàng (Tập 1–3 buổi/tuần)</option>
                                <option value="1.55" ${p.activity == 1.55 ? 'selected' : ''}>Trung bình (Tập gym 3–5 buổi/tuần)</option>
                                <option value="1.725" ${p.activity == 1.725 ? 'selected' : ''}>Năng động (Tập nặng 6–7 buổi/tuần)</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="font-bold block mb-1">Mục tiêu chính</label>
                                <select id="pf-goal" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-semibold">
                                    <option value="cut" ${p.goal === 'cut' ? 'selected' : ''}>🔥 Giảm mỡ (-400 kcal)</option>
                                    <option value="maintain" ${p.goal === 'maintain' ? 'selected' : ''}>⚖️ Giữ cân & săn chắc</option>
                                    <option value="bulk" ${p.goal === 'bulk' ? 'selected' : ''}>💪 Tăng cơ (+300 kcal)</option>
                                </select>
                            </div>
                            <div>
                                <label class="font-bold block mb-1">Mục tiêu nước (ml)</label>
                                <input id="pf-water" type="number" step="100" value="${p.waterGoal}" class="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold"/>
                            </div>
                        </div>

                        <label class="min-h-[56px] flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-brand-50 dark:bg-brand-500/10 border border-brand-200/70 dark:border-brand-500/25 cursor-pointer">
                            <div class="min-w-0">
                                <p class="text-base font-extrabold text-brand-800 dark:text-brand-300">⚖️ Tự cân bằng ngân sách Calo tuần</p>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Lỡ ăn lố hôm trước sẽ tự chia đều lại cho các ngày còn lại</p>
                            </div>
                            <input id="pf-weekly" type="checkbox" ${p.weeklyBalance ? 'checked' : ''} class="w-6 h-6 shrink-0 accent-brand-500"/>

                        <button type="submit" class="w-full min-h-[48px] py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-base font-extrabold shadow-sm active:scale-95 transition">
                            Lưu & Tính lại mục tiêu
                        </button>
                    </form>
                </section>

                <!-- Sao lưu & Khôi phục dữ liệu -->
                <section class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
                    <h3 class="text-lg font-extrabold">Sao lưu & Dữ liệu ứng dụng</h3>
                    <p class="text-base text-slate-500 dark:text-slate-400">Mọi dữ liệu của bạn được tự động lưu trực tiếp trên điện thoại. Bạn có thể xuất tệp dự phòng bất cứ lúc nào.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <button onclick="exportJsonData()" class="min-h-[48px] py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold active:scale-95 transition">📤 Xuất file .JSON</button>
                        <button onclick="document.getElementById('import-json-input').click()" class="min-h-[48px] py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold active:scale-95 transition">📥 Nhập file .JSON</button>
                    </div>
                    <button onclick="confirmResetApp()" class="w-full min-h-[48px] py-2.5 rounded-xl bg-rose-50 dark:bg-rose-500/15 text-rose-600 dark:text-rose-400 text-base font-bold active:scale-95 transition">
                        🗑️ Khôi phục dữ liệu mẫu ban đầu
                    </button>
                </section>
            </div>
        `;
    }

    function saveProfileForm(e) {
        e.preventDefault();
        appState.profile = {
            ...appState.profile,
            name: document.getElementById('pf-name').value.trim() || 'Bạn tập Gym',
            gender: document.getElementById('pf-gender').value,
            age: Number(document.getElementById('pf-age').value) || 25,
            height: Number(document.getElementById('pf-height').value) || 170,
            weight: Number(document.getElementById('pf-weight').value) || 70,
            activity: Number(document.getElementById('pf-activity').value) || 1.55,
            goal: document.getElementById('pf-goal').value,
            waterGoal: Number(document.getElementById('pf-water').value) || 2500,
            weeklyBalance: document.getElementById('pf-weekly').checked
        };
        renderApp();
        showToast('✅ Đã cập nhật hồ sơ & tính lại TDEE, Macro!');
    }

    function exportJsonData() {
        try {
            const data = JSON.stringify({
                profile: appState.profile,
                customFoods: appState.customFoods,
                weekLogs: appState.weekLogs,
                routines: appState.routines,
                workoutHistory: appState.workoutHistory,
                weightHistory: appState.weightHistory
            }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nutrigym-vn-backup-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('📤 Đã xuất tệp sao lưu .JSON thành công!');
        } catch (err) {
            showToast('Không thể xuất tệp trong khung xem trước này', 'warning');
        }
    }

    function handleImportJson(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                if (parsed.profile) appState.profile = { ...appState.profile, ...parsed.profile };
                if (Array.isArray(parsed.customFoods)) appState.customFoods = parsed.customFoods;
                if (Array.isArray(parsed.weekLogs) && parsed.weekLogs.length === 7) appState.weekLogs = parsed.weekLogs;
                if (Array.isArray(parsed.routines)) appState.routines = parsed.routines;
                if (Array.isArray(parsed.workoutHistory)) appState.workoutHistory = parsed.workoutHistory;
                if (Array.isArray(parsed.weightHistory)) appState.weightHistory = parsed.weightHistory;
                renderApp();
                showToast('📥 Đã khôi phục dữ liệu thành công!');
            } catch (err) {
                showToast('Tệp JSON không đúng định dạng NutriGym VN', 'danger');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    function confirmResetApp() {
        openModal('🗑️ Khôi phục dữ liệu mặc định?', `
            <div class="space-y-4 text-base">
                <p class="text-slate-600 dark:text-slate-300">Thao tác này sẽ đặt lại toàn bộ nhật ký ăn uống và buổi tập về dữ liệu mẫu ban đầu. Bạn chắc chắn chứ?</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button onclick="closeModal()" class="min-h-[48px] py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-base font-bold">Hủy</button>
                    <button onclick="resetAppNow()" class="min-h-[48px] py-2.5 rounded-xl bg-rose-600 text-white text-base font-extrabold">Đặt lại ngay</button>
                </div>
            </div>
        `);
    }

    function resetAppNow() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        appState = createDefaultState();
        closeModal();
        renderApp();
        showToast('Đã khôi phục dữ liệu mẫu ban đầu', 'info');
    }

    // =========================================================================
    // 13. TRỢ LÝ CÀI ĐẶT APP LÊN ĐIỆN THOẠI (IPHONE & ANDROID)
    // =========================================================================
    async function triggerNativeInstall() {
        if (!deferredInstallPrompt) return;
        try {
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') showToast('Đang cài đặt NutriGym VN... 📲');
            deferredInstallPrompt = null;
            closeModal();
        } catch (err) {
            showToast('Hãy mở menu trình duyệt và chọn Thêm vào màn hình chính nhé!', 'info');
        }
    }

    /** Xuất ra tệp index.html sạch, sẵn sàng tải lên tiiny.host / Netlify Drop */
    function downloadStandaloneIndexHtml() {
        try {
            const clone = document.documentElement.cloneNode(true);
            clone.querySelectorAll('[data-dynamic-pwa="true"]').forEach(el => el.remove());

            const mainEl = clone.querySelector('#main-content');
            if (mainEl) mainEl.innerHTML = '';

            const modalBackdrop = clone.querySelector('#modal-backdrop');
            if (modalBackdrop) modalBackdrop.classList.add('hidden');

            const modalBody = clone.querySelector('#modal-body');
            if (modalBody) modalBody.innerHTML = '';

            const mobileMenu = clone.querySelector('#mobile-nav-menu');
            if (mobileMenu) mobileMenu.classList.add('hidden');

            const toastEl = clone.querySelector('#toast-container');
            if (toastEl) toastEl.innerHTML = '';

            const bannerEl = clone.querySelector('#active-workout-banner');
            if (bannerEl) bannerEl.classList.add('hidden');

            const fullHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
            const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            showToast('📥 Đã tải tệp index.html! Đưa lên tiiny.host để lấy link cài App.');
        } catch (err) {
            showToast('Hãy sao chép mã nguồn và lưu thành tệp index.html nhé!', 'warning');
        }
    }

    function openInstallModal() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const isPreviewOrLocal = window.self !== window.top || !window.location.protocol.startsWith('http');
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');

        let statusBanner = '';
        if (isStandalone) {
            statusBanner = `
                <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-500/15 border border-emerald-200 dark:border-emerald-500/30">
                    <p class="font-extrabold text-emerald-800 dark:text-emerald-300">✅ Bạn đã cài NutriGym VN thành công!</p>
                    <p class="text-slate-600 dark:text-slate-300 mt-1">App đang chạy toàn màn hình và tự động lưu dữ liệu ngay trên máy của bạn.</p>
                </div>`;
        } else if (deferredInstallPrompt) {
            statusBanner = `
                <div class="p-4 rounded-2xl bg-brand-50 dark:bg-brand-500/15 border border-brand-200 dark:border-brand-500/30 space-y-3">
                    <p class="font-extrabold text-brand-800 dark:text-brand-300">🚀 Điện thoại của bạn đã sẵn sàng cài ngay!</p>
                    <button onclick="triggerNativeInstall()" class="w-full min-h-[48px] py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white text-base font-extrabold shadow-md active:scale-95 transition">
                        📲 Bấm Cài Đặt App Ngay (1 chạm)
                    </button>
                </div>`;
        } else if (isPreviewOrLocal) {
            statusBanner = `
                <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-500/15 border border-amber-200 dark:border-amber-500/30 space-y-1.5">
                    <p class="font-extrabold text-amber-800 dark:text-amber-300">⚠️ Vì sao chưa cài trực tiếp từ đây được?</p>
                    <p class="text-slate-700 dark:text-slate-300">iPhone & Android bắt buộc app phải mở qua một <b>đường link web (https://...)</b> thì mới hiện nút cài lên màn hình chính.</p>
                </div>`;
        }

        openModal('📱 Cài NutriGym VN lên điện thoại', `
            <div class="space-y-4 text-base leading-relaxed">
                ${statusBanner}

                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-3">
                    <h4 class="font-extrabold text-base text-brand-600 dark:text-brand-400">Bước 1: Tạo link web riêng miễn phí (30 giây)</h4>
                    <ol class="list-decimal pl-5 space-y-1.5 text-slate-600 dark:text-slate-300">
                        <li>Bấm nút bên dưới để tải tệp <b>index.html</b> về máy.</li>
                        <li>Mở trang miễn phí <b>tiiny.host</b> (hoặc <b>app.netlify.com/drop</b>).</li>
                        <li>Tải tệp <b>index.html</b> lên → Nhận ngay đường link <b>https://...</b> riêng cho app của bạn.</li>
                    </ol>
                    <button onclick="downloadStandaloneIndexHtml()" class="w-full min-h-[48px] py-3 rounded-xl bg-gym-600 hover:bg-gym-500 text-white text-base font-extrabold shadow-sm active:scale-95 transition">
                        ⬇️ Tải ngay tệp index.html về máy
                    </button>
                </div>

                <div class="p-4 rounded-2xl border ${isIOS ? 'bg-brand-50/70 dark:bg-brand-500/10 border-brand-300 dark:border-brand-500/40' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">
                    <h4 class="font-extrabold text-base mb-1.5">🍎 Bước 2 trên iPhone / iPad (Dùng Safari)</h4>
                    <ol class="list-decimal pl-5 space-y-1.5 text-slate-600 dark:text-slate-300">
                        <li>Mở link web vừa tạo bằng trình duyệt <b>Safari</b>.</li>
                        <li>Chạm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên ở dưới cùng).</li>
                        <li>Chọn <b>"Thêm vào MH chính"</b> → Bấm <b>Thêm</b>.</li>
                    </ol>
                </div>

                <div class="p-4 rounded-2xl border ${!isIOS ? 'bg-brand-50/70 dark:bg-brand-500/10 border-brand-300 dark:border-brand-500/40' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">
                    <h4 class="font-extrabold text-base mb-1.5">🤖 Bước 2 trên Android (Dùng Chrome)</h4>
                    <ol class="list-decimal pl-5 space-y-1.5 text-slate-600 dark:text-slate-300">
                        <li>Mở link web vừa tạo bằng <b>Google Chrome</b>.</li>
                        <li>Chạm dấu <b>3 chấm dọc (⋮)</b> ở góc phải trên cùng.</li>
                        <li>Chọn <b>"Thêm vào Màn hình chính"</b> hoặc <b>"Cài đặt ứng dụng"</b>.</li>
                    </ol>
                </div>

                <button onclick="closeModal()" class="w-full min-h-[48px] py-3 rounded-2xl bg-slate-900 dark:bg-brand-500 text-white text-base font-extrabold">Đã hiểu!</button>
            </div>
        `);
    }

    // =========================================================================
    // 14. KHỞI CHẠY AN TOÀN NGAY LẬP TỨC
    // =========================================================================
    function initApp() {
        try {
            loadStateFromStorage();
            renderApp();
        } catch (err) {
            console.error('Lỗi khởi chạy NutriGym VN:', err);
            const main = document.getElementById('main-content');
            if (main) {
                main.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 text-rose-700 text-base font-bold">Đã có lỗi nhỏ khi khởi chạy, bạn hãy bấm tải lại trang nhé.</div>`;
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
    </script>
